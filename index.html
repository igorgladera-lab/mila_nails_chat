<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Mila Whats</title>

<script>
  (function(){
    try{
      var salvo = localStorage.getItem("mila_whats_tema");
      var tema;
      if(salvo === "dark" || salvo === "light"){
        tema = salvo;
      } else {
        tema = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", tema);
    }catch(e){}
  })();
</script>

<meta name="theme-color" content="#7b1e3a">
<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.json">

<link rel="icon" type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237b1e3a'/%3E%3Cpath d='M8 10 h16 v10 h-10 l-4 4 v-4 h-2 z' fill='%23ffffff'/%3E%3C/svg%3E">

<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Mila Whats">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
  :root{
    --bg:#faf7f5;
    --surface:#ffffff;
    --primary:#a02850;
    --primary-dark:#7b1e3a;
    --text:#2b2b2b;
    --muted:#8a7f7a;
    --border:#e8e2de;
    --header-h:52px;
    --msg-enviada:#dcf8c6;
    --msg-enviada-text:#1a1a1a;
    --msg-recebida:#ffffff;
    --msg-recebida-text:#2b2b2b;
    --aviso-24h:#fff3e0;
    --aviso-24h-borda:#f0a800;
    --aviso-24h-text:#6b5200;
    --btn-bg:#f5efec;
    --btn-active:#ece2dc;
    --input-bg:#ffffff;
    --input-bg-alt:#faf7f5;
    --overlay-bg:rgba(0,0,0,.45);
    --chat-bg:#efe6e1;
    --chat-bubble-enviada:#dcf8c6;
    --chat-bubble-recebida:#ffffff;
    --chat-bubble-erro:#ffcdd2;
    --push-ok:#e8f5e9;
    --push-ok-borda:#a5d6a7;
    --push-ok-texto:#2e7d32;
    --push-erro:#fce4ec;
    --push-erro-borda:#f48fb1;
    --push-erro-texto:#ad1457;
    --badge-bg:#25d366;
    --badge-text:#ffffff;
    --audio-bg-enviada:#c8e6a0;
    --audio-bg-recebida:#e8e2de;
    --gravando:#c62828;
  }

  html[data-theme="dark"]{
    --bg:#1a1a1a;
    --surface:#262626;
    --primary:#c03060;
    --primary-dark:#a02850;
    --text:#e8e8e8;
    --muted:#9a9a9a;
    --border:#3a3a3a;
    --msg-enviada:#1e3a20;
    --msg-enviada-text:#e8e8e8;
    --msg-recebida:#262626;
    --msg-recebida-text:#e8e8e8;
    --aviso-24h:#3a2e18;
    --aviso-24h-borda:#d99a00;
    --aviso-24h-text:#f0d580;
    --btn-bg:#333333;
    --btn-active:#404040;
    --input-bg:#2a2a2a;
    --input-bg-alt:#2a2a2a;
    --overlay-bg:rgba(0,0,0,.7);
    --chat-bg:#141414;
    --chat-bubble-enviada:#1e4a20;
    --chat-bubble-recebida:#2e2e2e;
    --chat-bubble-erro:#4a1e1e;
    --push-ok:#1e3a20;
    --push-ok-borda:#2e5a30;
    --push-ok-texto:#81c784;
    --push-erro:#3a1e2a;
    --push-erro-borda:#6a2a4a;
    --push-erro-texto:#f48fb1;
    --badge-bg:#25d366;
    --badge-text:#ffffff;
    --audio-bg-enviada:#1e4a20;
    --audio-bg-recebida:#3a3a3a;
    --gravando:#ef5350;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

  html, body{
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
    overscroll-behavior:none;
  }

  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    position:fixed;
    inset:0;
    touch-action:manipulation;
  }

  header.app-header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:var(--header-h);
    padding-top:env(safe-area-inset-top);
    box-sizing:content-box;
    background:var(--primary);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding-left:16px;
    padding-right:12px;
    font-weight:700;
    font-size:18px;
    letter-spacing:1px;
    z-index:10;
    box-shadow:0 1px 3px rgba(0,0,0,.15);
  }

  header.app-header .header-title{
    flex:1;
    display:flex;
    align-items:center;
    gap:8px;
  }

  header.app-header .header-title .nome-conversa{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  header.app-header .header-btn{
    background:transparent;
    border:none;
    color:#fff;
    font-size:22px;
    cursor:pointer;
    padding:8px;
    line-height:1;
    border-radius:50%;
  }

  header.app-header .header-btn:active{
    background:rgba(255,255,255,.15);
  }

  header.app-header .header-voltar{
    margin-right:4px;
    font-size:24px;
    padding:4px 8px;
  }

  .content{
    position:fixed;
    left:0;
    right:0;
    top:calc(var(--header-h) + env(safe-area-inset-top));
    bottom:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
  }

  .btn-float{
    position:fixed;
    bottom:calc(16px + env(safe-area-inset-bottom));
    right:16px;
    width:44px;
    height:44px;
    border-radius:50%;
    background:var(--primary);
    color:#fff;
    border:none;
    font-size:20px;
    cursor:pointer;
    box-shadow:0 3px 8px rgba(0,0,0,.25);
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    transition:transform .2s;
  }
  .btn-float:active{
    transform:scale(.94);
  }
  .btn-float.girando{
    animation:girar .8s linear infinite;
  }
  @keyframes girar{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(360deg); }
  }

  .lista{
    padding:0;
  }

  .conversa{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 16px;
    border-bottom:1px solid var(--border);
    background:var(--surface);
    cursor:pointer;
    transition:background .15s;
  }
  .conversa:active{
    background:var(--btn-active);
  }

  .conversa .avatar{
    width:48px;
    height:48px;
    border-radius:50%;
    background:var(--primary);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    font-weight:700;
    flex:0 0 auto;
    text-transform:uppercase;
  }

  .conversa .info{
    flex:1;
    min-width:0;
  }

  .conversa .linha1{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:8px;
    margin-bottom:2px;
  }

  .conversa .nome{
    font-size:15px;
    font-weight:600;
    color:var(--text);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    flex:1;
  }

  .conversa .nome.negrito{
    font-weight:800;
  }

  .conversa .horario{
    font-size:11px;
    color:var(--muted);
    flex:0 0 auto;
  }

  .conversa .ultima{
    font-size:13px;
    color:var(--muted);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .conversa .ultima.enviada::before{
    content:"Você: ";
    color:var(--primary);
    font-weight:600;
  }

  .conversa .ultima .preview-emoji{
    margin-right:3px;
  }

  .conversa .badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:20px;
    height:20px;
    padding:0 6px;
    border-radius:10px;
    background:var(--badge-bg);
    color:var(--badge-text);
    font-size:11px;
    font-weight:700;
    line-height:1;
    flex:0 0 auto;
    margin-left:6px;
    box-shadow:0 1px 2px rgba(0,0,0,.15);
  }
  .conversa .badge.mais{
    font-size:10px;
    letter-spacing:0;
  }

  .conversa .linha-badge{
    display:flex;
    align-items:center;
    gap:6px;
    flex:0 0 auto;
  }

  .vazio, .carregando, .erro{
    text-align:center;
    padding:80px 24px;
    color:var(--muted);
  }

  .vazio .icone, .erro .icone{
    font-size:72px;
    margin-bottom:20px;
    opacity:.4;
  }
  .erro .icone{
    opacity:1;
    color:#c62828;
    font-size:56px;
  }

  .vazio .titulo, .erro .titulo{
    font-size:18px;
    font-weight:700;
    color:var(--text);
    margin-bottom:8px;
  }

  .vazio .texto, .erro .texto{
    font-size:14px;
    line-height:1.5;
    margin-bottom:24px;
  }

  .vazio .btn, .erro .btn{
    background:var(--primary);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:12px 24px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }

  .carregando .spinner{
    width:44px;
    height:44px;
    border:3px solid var(--border);
    border-top-color:var(--primary);
    border-radius:50%;
    margin:0 auto 16px;
    animation:girar .8s linear infinite;
  }

  .chat-container{
    position:fixed;
    left:0;
    right:0;
    top:calc(var(--header-h) + env(safe-area-inset-top));
    bottom:calc(64px + env(safe-area-inset-bottom));
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    background:var(--chat-bg);
    padding:12px 8px;
    overscroll-behavior:contain;
  }

  .chat-aviso-24h{
    background:var(--aviso-24h);
    border:1px solid var(--aviso-24h-borda);
    color:var(--aviso-24h-text);
    border-radius:8px;
    padding:10px 12px;
    font-size:12px;
    line-height:1.4;
    margin:0 8px 12px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .chat-aviso-24h .icone{
    font-size:16px;
    flex:0 0 auto;
  }

  .chat-msg{
    display:flex;
    margin-bottom:8px;
    padding:0 4px;
  }

  .chat-msg.recebida{
    justify-content:flex-start;
  }

  .chat-msg.enviada{
    justify-content:flex-end;
  }

  .chat-bubble{
    max-width:80%;
    padding:8px 12px 6px;
    border-radius:12px;
    font-size:14px;
    line-height:1.4;
    word-wrap:break-word;
    box-shadow:0 1px 2px rgba(0,0,0,.08);
    position:relative;
  }

  .chat-msg.recebida .chat-bubble{
    background:var(--chat-bubble-recebida);
    color:var(--text);
    border-top-left-radius:4px;
  }

  .chat-msg.enviada .chat-bubble{
    background:var(--chat-bubble-enviada);
    color:var(--msg-enviada-text);
    border-top-right-radius:4px;
  }

  .chat-msg.enviada .chat-bubble.erro{
    background:var(--chat-bubble-erro);
  }

  .chat-bubble .texto{
    white-space:pre-wrap;
    word-break:break-word;
  }

  .chat-bubble .meta{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:4px;
    font-size:10px;
    color:var(--muted);
    margin-top:3px;
    line-height:1;
  }

  .chat-msg.enviada .chat-bubble .meta{
    color:rgba(0,0,0,.45);
  }

  html[data-theme="dark"] .chat-msg.enviada .chat-bubble .meta{
    color:rgba(232,232,232,.55);
  }

  .chat-bubble .meta .status{
    font-size:11px;
    line-height:1;
  }

  /* ====== BOLHA DE IMAGEM ====== */
  .chat-bubble.bubble-img{
    padding:4px;
    overflow:hidden;
  }

  .chat-bubble.bubble-img .chat-img{
    display:block;
    max-width:100%;
    max-height:340px;
    border-radius:8px;
    cursor:pointer;
    background:var(--input-bg-alt);
  }

  .chat-bubble.bubble-img .legenda{
    padding:6px 6px 2px;
    font-size:14px;
    line-height:1.35;
    white-space:pre-wrap;
    word-break:break-word;
  }

  .chat-bubble.bubble-img .meta{
    padding-right:6px;
    padding-bottom:2px;
  }

  /* ====== BOLHA DE ÁUDIO ====== */
  .chat-bubble.bubble-audio{
    padding:8px 12px;
    min-width:220px;
  }

  .audio-player{
    display:flex;
    align-items:center;
    gap:8px;
  }

  .audio-player .btn-play{
    width:34px;
    height:34px;
    border-radius:50%;
    background:var(--primary);
    color:#fff;
    border:none;
    cursor:pointer;
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    transition:transform .1s;
  }
  .audio-player .btn-play:active{
    transform:scale(.92);
  }
  .audio-player .btn-play svg{
    display:block;
  }

  .audio-player .onda{
    flex:1;
    height:22px;
    display:flex;
    align-items:center;
    gap:2px;
    position:relative;
    cursor:pointer;
    user-select:none;
  }

  .audio-player .onda .barra{
    flex:1;
    background:rgba(0,0,0,.18);
    border-radius:2px;
    transition:background .1s;
  }
  html[data-theme="dark"] .audio-player .onda .barra{
    background:rgba(255,255,255,.22);
  }
  .audio-player .onda .barra.ativa{
    background:var(--primary);
  }

  .audio-player .tempo{
    font-size:11px;
    color:var(--muted);
    flex:0 0 auto;
    min-width:36px;
    text-align:right;
    font-variant-numeric:tabular-nums;
  }

  /* ====== BARRA DE INPUT ====== */
  .chat-input-bar{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    padding:8px 8px calc(8px + env(safe-area-inset-bottom));
    background:var(--surface);
    border-top:1px solid var(--border);
    display:flex;
    align-items:flex-end;
    gap:6px;
    z-index:15;
  }

  .chat-input-bar .btn-icone{
    width:40px;
    height:40px;
    border-radius:50%;
    background:transparent;
    color:var(--primary);
    border:none;
    cursor:pointer;
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    transition:transform .1s, background .15s;
  }
  .chat-input-bar .btn-icone:active{
    transform:scale(.92);
    background:var(--btn-active);
  }
  .chat-input-bar .btn-icone:disabled{
    opacity:.4;
    cursor:not-allowed;
  }
  .chat-input-bar .btn-icone svg{
    display:block;
  }

  .chat-input-bar textarea{
    flex:1;
    border:1px solid var(--border);
    border-radius:20px;
    padding:10px 14px;
    font-size:15px;
    font-family:inherit;
    background:var(--input-bg);
    color:var(--text);
    outline:none;
    resize:none;
    max-height:100px;
    min-height:40px;
    line-height:1.4;
  }

  .chat-input-bar textarea:focus{
    border-color:var(--primary);
  }

  .chat-input-bar textarea:disabled{
    opacity:.5;
    cursor:not-allowed;
  }

  .chat-input-bar .btn-enviar{
    width:40px;
    height:40px;
    border-radius:50%;
    background:var(--primary);
    color:#fff;
    border:none;
    cursor:pointer;
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    transition:transform .1s, opacity .15s;
  }
  .chat-input-bar .btn-enviar:active{
    transform:scale(.92);
  }
  .chat-input-bar .btn-enviar:disabled{
    opacity:.4;
    cursor:not-allowed;
  }
  .chat-input-bar .btn-enviar svg{
    display:block;
  }

  /* ====== GRAVAÇÃO DE ÁUDIO ====== */
  .chat-input-bar.gravando{
    background:var(--gravando);
    border-top-color:var(--gravando);
  }

  .chat-input-bar.gravando .btn-icone,
  .chat-input-bar.gravando .btn-enviar,
  .chat-input-bar.gravando textarea{
    display:none !important;
  }

  .chat-input-bar .gravando-ui{
    display:none;
    flex:1;
    align-items:center;
    gap:10px;
    color:#fff;
    font-size:14px;
    font-weight:600;
  }

  .chat-input-bar.gravando .gravando-ui{
    display:flex;
  }

  .chat-input-bar .gravando-ui .pisca{
    width:12px;
    height:12px;
    border-radius:50%;
    background:#fff;
    animation:piscar 1s infinite;
    flex:0 0 auto;
  }
  @keyframes piscar{
    0%,100%{ opacity:1; }
    50%{ opacity:.2; }
  }

  .chat-input-bar .gravando-ui .tempo-grav{
    font-variant-numeric:tabular-nums;
    margin-left:auto;
  }

  .chat-input-bar .gravando-ui .btn-cancelar-grav{
    background:rgba(255,255,255,.2);
    color:#fff;
    border:none;
    border-radius:6px;
    padding:8px 12px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    margin-left:12px;
  }

  .chat-input-bar .gravando-ui .btn-parar-grav{
    background:#fff;
    color:var(--gravando);
    border:none;
    border-radius:6px;
    padding:8px 14px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    margin-left:8px;
  }

  /* ====== OVERLAY DE IMAGEM CHEIA ====== */
  .img-full{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.92);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:300;
    padding:20px;
    cursor:zoom-out;
  }
  .img-full.show{
    display:flex;
  }
  .img-full img{
    max-width:100%;
    max-height:100%;
    border-radius:8px;
    box-shadow:0 8px 32px rgba(0,0,0,.6);
  }
  .img-full .fechar{
    position:fixed;
    top:calc(16px + env(safe-area-inset-top));
    right:16px;
    width:44px;
    height:44px;
    border-radius:50%;
    background:rgba(255,255,255,.15);
    color:#fff;
    border:none;
    font-size:22px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* ====== OVERLAYS ====== */
  .overlay{
    position:fixed;
    inset:0;
    background:var(--overlay-bg);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:100;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .overlay.show{
    display:flex;
  }

  .sheet{
    background:var(--surface);
    width:100%;
    max-width:520px;
    max-height:88vh;
    border-radius:16px 16px 0 0;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    animation:slideUp .2s ease;
  }
  @keyframes slideUp{
    from{ transform:translateY(20px); opacity:.6; }
    to{ transform:translateY(0); opacity:1; }
  }

  .sheet-header{
    padding:14px 16px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex:0 0 auto;
  }
  .sheet-title{
    font-size:16px;
    font-weight:700;
    color:var(--text);
  }
  .sheet-close{
    background:transparent;
    border:none;
    font-size:22px;
    color:var(--muted);
    cursor:pointer;
    padding:0 4px;
    line-height:1;
  }

  .sheet-body{
    flex:1 1 auto;
    overflow-y:auto;
    padding:16px;
  }
  .sheet-footer{
    flex:0 0 auto;
    padding:12px 16px;
    border-top:1px solid var(--border);
    display:flex;
    gap:8px;
  }

  .form-group{
    margin-bottom:14px;
  }
  .form-group label{
    display:block;
    font-size:12px;
    font-weight:600;
    color:var(--muted);
    margin-bottom:6px;
    text-transform:uppercase;
    letter-spacing:.5px;
  }
  .form-group input{
    width:100%;
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px 14px;
    font-size:15px;
    font-family:inherit;
    background:var(--input-bg);
    color:var(--text);
    outline:none;
    transition:border .15s;
  }
  .form-group input:focus{
    border-color:var(--primary);
  }

  .form-aviso{
    font-size:12px;
    color:var(--muted);
    line-height:1.5;
    margin-bottom:16px;
    padding:10px 12px;
    background:var(--input-bg-alt);

  }

  .push-bloco{
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px;
    margin-bottom:16px;
    background:var(--input-bg-alt);
  }

  .push-bloco .push-titulo{
    font-size:13px;
    font-weight:700;
    color:var(--text);
    margin-bottom:8px;
    display:flex;
    align-items:center;
    gap:6px;

  .push-bloco .push-status{
    font-size:12px;
    color:var(--muted);
    line-height:1.5;
    margin-bottom:12px;

  .push-bloco .push-btn{
    width:100%;
    background:var(--primary);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:12px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:background .15s, opacity .15s;

  .push-bloco .push-btn:active{
    background:var(--primary-dark);
  }

  .push-bloco .push-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
  }

  .btn{
    border:none;
    border-radius:8px;
    font-size:15px;
    font-weight:600;
    padding:12px 16px;
    cursor:pointer;
    transition:background .15s;
    flex:1;
  }
  .btn-primary{
    background:var(--primary);
    color:#fff;
  }
  .btn-primary:active{
    background:var(--primary-dark);
  }
  .btn-primary:disabled{
    opacity:.5;
    cursor:not-allowed;
  }
  .btn-secondary{
    background:var(--btn-bg);
    color:var(--text);
  }
  .btn-secondary:active{
    background:var(--btn-active);
  }

  /* ====== OVERLAY DE LEGENDA (imagem) ====== */
  .preview-img{
    width:100%;
    max-height:300px;
    object-fit:contain;
    background:var(--input-bg-alt);
    border-radius:8px;
    margin-bottom:12px;
    display:block;
  }

  ::-webkit-scrollbar{ width:0; height:0; }
</style>
</head>

<script>
(function(){
  "use strict";

  const LS_CONFIG = "mila_whats_config";
  const INTERVALO_REFRESH_LISTA    = 30000;
  const INTERVALO_REFRESH_CONVERSA = 15000;

  const LIMITE_IMG   = 5  * 1024 * 1024;  // 5 MB
  const LIMITE_AUDIO = 16 * 1024 * 1024;  // 16 MB

  const VAPID_PUBLIC_KEY = "BPaeCnBrwLNEAYDwSWy9UI_ZsoBCLsbiJjNtagxCa3PC9gNa8rTuUpngtyBJsaM4FktUkfhHp3rmgmwcTjjL8AE";

  /* =========================================================
     ESTADO
     ========================================================= */
  let state = {
    backendUrl: "",
    apiKey: "",

    conversas: [],
    carregando: false,
    erro: null,

    telefoneAtual: null,
    clienteAtual: "",
    mensagens: [],
    carregandoConversa: false,
    erroConversa: null,
    enviando: false,
    janelaAberta: false,
    janelaFechaEm: null,

    timerRefreshLista: null,
    timerRefreshConversa: null,

    swRegistration: null,
    pushSubscription: null,
    pushSuportado: false,
    pushAtivo: false,

    // Imagem pendente para envio
    imagemPendente: null,

    // Gravação de áudio
    gravando: false,
    mediaRecorder: null,
    chunksAudio: [],
    inicioGravacao: 0,
    timerGravacao: null,
    streamAudio: null,

    // Player de áudio ativo
    audioPlayerAtivo: null
  };

  /* =========================================================
     PERSISTÊNCIA
     ========================================================= */
  function loadConfig(){
    try{
      const raw = JSON.parse(localStorage.getItem(LS_CONFIG) || "null");
      if(raw && typeof raw === "object"){
        state.backendUrl = typeof raw.backendUrl === "string" ? raw.backendUrl : "";
        state.apiKey     = typeof raw.apiKey === "string" ? raw.apiKey : "";
      }
    }catch(e){}
  }

  function saveConfig(){
    localStorage.setItem(LS_CONFIG, JSON.stringify({
      backendUrl: state.backendUrl,
      apiKey: state.apiKey
    }));
  }

  function temConfig(){
    return !!(state.backendUrl && state.apiKey);
  }

  function urlBase(path){
    return state.backendUrl.replace(/\/+$/, "") + path;
  }

  /* =========================================================
     HELPERS
     ========================================================= */
  function escapeHtml(s){
    if(s === undefined || s === null) return "";
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function iniciais(nome){
    if(!nome) return "?";
    const partes = nome.trim().split(/\s+/);
    if(partes.length === 1) return partes[0].slice(0, 2).toUpperCase();
    return (partes[0][0] + partes[partes.length - 1][0]).toUpperCase();
  }

  function formatarHorario(iso){
    if(!iso) return "";
    const d = new Date(iso);
    const agora = new Date();
    const mesmoDia = d.toDateString() === agora.toDateString();

    const ontem = new Date(agora);
    ontem.setDate(ontem.getDate() - 1);
    const ehOntem = d.toDateString() === ontem.toDateString();

    const hh = String(d.getHours()).padStart(2, "0");
    const mm = String(d.getMinutes()).padStart(2, "0");

    if(mesmoDia) return hh + ":" + mm;
    if(ehOntem)  return "ontem";
    return String(d.getDate()).padStart(2, "0") + "/" +
           String(d.getMonth() + 1).padStart(2, "0");
  }

  function formatarHoraBubble(iso){
    if(!iso) return "";
    const d = new Date(iso);
    return String(d.getHours()).padStart(2, "0") + ":" +
           String(d.getMinutes()).padStart(2, "0");
  }

  function formatarDuracao(seg){
    if(!seg || seg < 0) seg = 0;
    const m = Math.floor(seg / 60);
    const s = Math.floor(seg % 60);
    return m + ":" + String(s).padStart(2, "0");
  }

  function calcularJanela24h(mensagens){
    for(let i = mensagens.length - 1; i >= 0; i--){
      if(mensagens[i].direcao === "recebida"){
        const quando = new Date(mensagens[i].enviado_em).getTime();
        const agora = Date.now();
        const diff = agora - quando;
        const VINTE_QUATRO_HORAS = 24 * 60 * 60 * 1000;
        return {
          aberta: diff < VINTE_QUATRO_HORAS,
          fechaEm: new Date(quando + VINTE_QUATRO_HORAS).toISOString()
        };
      }
    }
    return { aberta: false, fechaEm: null };
  }

  function formatarBadge(n){
    if(!n || n <= 0) return "";
    if(n > 99) return "99+";
    return String(n);
  }

  function previewUltima(c){
    const tipo = c.ultima_tipo || "text";
    const txt = c.ultima_mensagem || "";
    if(tipo === "image") return "📷 Foto" + (txt && txt !== "[Imagem]" ? ": " + txt : "");
    if(tipo === "audio") return "🎤 Áudio";
    if(tipo === "voice") return "🎤 Mensagem de voz";
    return txt;
  }

  /* =========================================================
     BADGE GLOBAL
     ========================================================= */
  async function atualizarBadge(){
    if(!("setAppBadge" in navigator)) return;
    if(!temConfig()){
      try{ await navigator.clearAppBadge(); }catch(e){}
      return;
    }

    try{
      const resp = await fetch(urlBase("/conversas/nao-lidas/total"), {
        method: "GET",
        headers: { "x-api-key": state.apiKey }
      });
      const data = await resp.json().catch(() => ({}));
      if(!resp.ok){
        try{ await navigator.clearAppBadge(); }catch(e){}
        return;
      }

      const total = Number(data.total) || 0;
      if(total > 0) await navigator.setAppBadge(total);
      else          await navigator.clearAppBadge();
    }catch(e){}
  }

  /* =========================================================
     URL ASSINADA DE MÍDIA
     ========================================================= */
  const cacheUrlAssinada = new Map(); // path -> { url, expiraEm }

  async function obterUrlAssinada(path){
    if(!path) return null;

    const agora = Date.now();
    const cache = cacheUrlAssinada.get(path);
    if(cache && cache.expiraEm > agora + 30000){
      return cache.url;
    }

    try{
      const resp = await fetch(
        urlBase("/media-url?path=" + encodeURIComponent(path)),
        { headers: { "x-api-key": state.apiKey } }
      );
      const data = await resp.json().catch(() => ({}));
      if(!resp.ok || !data.url) return null;

      cacheUrlAssinada.set(path, {
        url: data.url,
        expiraEm: agora + (data.expiraEm || 3600) * 1000
      });
      return data.url;
    }catch(e){
      return null;
    }
  }

  /* =========================================================
     PUSH NOTIFICATIONS
     ========================================================= */
  function urlBase64ToUint8Array(base64String){
    const padding = "=".repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
    const rawData = atob(base64);
    const outputArray = new Uint8Array(rawData.length);
    for(let i = 0; i < rawData.length; i++){
      outputArray[i] = rawData.charCodeAt(i);
    }
    return outputArray;
  }

  function detectarSuportePush(){
    const temSW = "serviceWorker" in navigator;
    const temPush = "PushManager" in window;
    const temNotification = "Notification" in window;
    state.pushSuportado = temSW && temPush && temNotification;
    return state.pushSuportado;
  }

  async function registrarServiceWorker(){
    if(!("serviceWorker" in navigator)) return null;
    try{
      const reg = await navigator.serviceWorker.register("sw.js", { scope: "./" });
      state.swRegistration = reg;
      return reg;
    }catch(err){
      console.error("[push] erro ao registrar SW:", err);
      return null;
    }
  }

  function atualizarPushUI(){
    const statusEl = document.getElementById("pushStatus");
    const btnEl = document.getElementById("btnAtivarPush");
    if(!statusEl || !btnEl) return;

    statusEl.classList.remove("ok", "erro");

    if(!detectarSuportePush()){
      statusEl.textContent = "⚠️ Este navegador não suporta notificações push.";
      statusEl.classList.add("erro");
      btnEl.disabled = true;
      btnEl.textContent = "Indisponível";
      return;
    }

    if(!temConfig()){
      statusEl.textContent = "Preencha a URL e a API Key primeiro, depois ative as notificações.";
      btnEl.disabled = true;
      btnEl.textContent = "Ativar notificações";
      return;
    }

    const permissao = Notification.permission;

    if(state.pushAtivo){
      statusEl.textContent = "✅ Notificações ativas neste aparelho.";
      statusEl.classList.add("ok");
      btnEl.disabled = false;
      btnEl.textContent = "Desativar notificações";
      return;
    }

    if(permissao === "denied"){
      statusEl.textContent = "❌ Permissão negada. Reative nas configurações do navegador.";
      statusEl.classList.add("erro");
      btnEl.disabled = true;
      btnEl.textContent = "Bloqueado";
      return;
    }

    if(permissao === "granted"){
      statusEl.textContent = "Permissão concedida. Toque em Ativar para concluir a inscrição.";
    } else {
      statusEl.textContent = "Toque em Ativar para permitir notificações neste aparelho.";
    }
    btnEl.disabled = false;
    btnEl.textContent = "Ativar notificações";
  }

  async function verificarSubscriptionExistente(){
    if(!state.swRegistration) return;
    try{
      const sub = await state.swRegistration.pushManager.getSubscription();
      if(sub){
        state.pushSubscription = sub;
        state.pushAtivo = true;
      } else {
        state.pushAtivo = false;
      }
    }catch(e){
      state.pushAtivo = false;
    }
  }

  async function ativarPush(){
    if(!temConfig()){
      alert("Preencha a URL e a API Key primeiro.");
      return;
    }

    const btn = document.getElementById("btnAtivarPush");
    btn.disabled = true;
    btn.textContent = "Ativando...";

    try{
      const permissao = await Notification.requestPermission();
      if(permissao !== "granted"){
        alert("Permissão negada. Você pode reativar nas configurações do navegador.");
        atualizarPushUI();
        return;
      }

      if(!state.swRegistration){
        state.swRegistration = await registrarServiceWorker();
      }
      if(!state.swRegistration){
        alert("Erro ao registrar o Service Worker. Recarregue o app e tente de novo.");
        atualizarPushUI();
        return;
      }

      await navigator.serviceWorker.ready;

      const sub = await state.swRegistration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });

      state.pushSubscription = sub;
      state.pushAtivo = true;

      const resp = await fetch(urlBase("/subscribe"), {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": state.apiKey
        },
        body: JSON.stringify({ subscription: sub })
      });

      if(!resp.ok){
        const data = await resp.json().catch(() => ({}));
        throw new Error(data.error || ("HTTP " + resp.status));
      }

      alert("Notificações ativadas com sucesso!");
      atualizarPushUI();

    }catch(err){
      console.error("[push] erro:", err);
      alert("Erro ao ativar notificações: " + err.message);
      state.pushAtivo = false;
      atualizarPushUI();
    }finally{
      btn.disabled = false;
    }
  }

  async function desativarPush(){
    const btn = document.getElementById("btnAtivarPush");
    btn.disabled = true;
    btn.textContent = "Desativando...";

    try{
      if(state.pushSubscription){
        try{
          await fetch(urlBase("/unsubscribe"), {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-api-key": state.apiKey
            },
            body: JSON.stringify({
              endpoint: state.pushSubscription.endpoint
            })
          });
        }catch(e){}

        await state.pushSubscription.unsubscribe();
        state.pushSubscription = null;
      }
      state.pushAtivo = false;
      alert("Notificações desativadas.");
      atualizarPushUI();
    }catch(err){
      alert("Erro ao desativar: " + err.message);
    }finally{
      btn.disabled = false;
    }
  }

  document.getElementById("btnAtivarPush").addEventListener("click", () => {
    if(state.pushAtivo) desativarPush();
    else ativarPush();
  });

  /* =========================================================
     OVERLAYS
     ========================================================= */
  function openOverlay(id){ document.getElementById(id).classList.add("show"); }
  function closeOverlay(id){ document.getElementById(id).classList.remove("show"); }

  document.querySelectorAll("[data-close]").forEach(btn => {
    btn.addEventListener("click", () => closeOverlay(btn.getAttribute("data-close")));
  });
  document.querySelectorAll(".overlay").forEach(ov => {
    ov.addEventListener("click", e => { if(e.target === ov) closeOverlay(ov.id); });
  });

  /* =========================================================
     NAVEGAÇÃO
     ========================================================= */
  function pararRefreshLista(){
    if(state.timerRefreshLista){
      clearInterval(state.timerRefreshLista);
      state.timerRefreshLista = null;
    }
  }

  function pararRefreshConversa(){
    if(state.timerRefreshConversa){
      clearInterval(state.timerRefreshConversa);
      state.timerRefreshConversa = null;
    }
  }

  function iniciarRefreshLista(){
    pararRefreshLista();
    state.timerRefreshLista = setInterval(() => {
      if(document.visibilityState !== "visible") return;
      if(state.telefoneAtual) return;
      carregarConversas({ silencioso: true });
    }, INTERVALO_REFRESH_LISTA);
  }

  function iniciarRefreshConversa(){
    pararRefreshConversa();
    state.timerRefreshConversa = setInterval(() => {
      if(document.visibilityState !== "visible") return;
      if(state.telefoneAtual) carregarConversa({ silencioso: true });
    }, INTERVALO_REFRESH_CONVERSA);
  }

  function mostrarLista(){
    document.getElementById("telaConversa").style.display = "none";
    document.getElementById("telaLista").style.display = "block";
    state.telefoneAtual = null;
    state.clienteAtual = "";
    state.mensagens = [];

    pararRefreshConversa();
    iniciarRefreshLista();

    carregarConversas();
  }

  function mostrarConversa(telefone, nome){
    document.getElementById("telaLista").style.display = "none";
    document.getElementById("telaConversa").style.display = "block";
    state.telefoneAtual = telefone;
    state.clienteAtual = nome || "Cliente";
    document.getElementById("nomeConversa").textContent = state.clienteAtual;

    state.mensagens = [];
    state.erroConversa = null;

    carregarConversa();
    marcarComoLida(telefone);

    pararRefreshLista();
    iniciarRefreshConversa();
  }

  async function marcarComoLida(telefone){
    if(!temConfig() || !telefone) return;

  function renderBubble(m){
    const ehEnviada = m.direcao === "enviada";
    const classe = ehEnviada ? "enviada" : "recebida";
    const erro = m._erro ? " erro" : "";
    const hora = formatarHoraBubble(m.enviado_em);

    let statusIcon = "";
    if(ehEnviada){
      if(m._enviando) statusIcon = "⏳";
      else if(m._erro) statusIcon = "⚠️";
      else statusIcon = "✓";
    }

    const tipo = m.tipo || "text";

    /* ---------- IMAGEM ---------- */
    if(tipo === "image"){
      const temUrl = !!m.media_url;
      const srcLocal = m._localSrc || ""; // usado para preview otimista
      const src = srcLocal || (m._urlAssinada || "");

      const imgTag = temUrl || srcLocal
        ? `<img class="chat-img" src="${escapeHtml(src)}" alt="Imagem" data-path="${escapeHtml(m.media_url || '')}" loading="lazy">`
        : `<div style="padding:40px 20px;text-align:center;color:var(--muted);font-size:12px;">📷 Imagem indisponível</div>`;

      const legenda = (m.conteudo && m.conteudo !== "[Imagem]")
        ? `<div class="legenda">${escapeHtml(m.conteudo)}</div>`
        : "";

      return `
        <div class="chat-msg ${classe}" data-msg-id="${escapeHtml(m.id || "")}">
          <div class="chat-bubble bubble-img${erro}">
            ${imgTag}
            ${legenda}
            <div class="meta">
              <span>${escapeHtml(hora)}</span>
              ${statusIcon ? `<span class="status">${statusIcon}</span>` : ""}
            </div>
          </div>
        </div>
      `;
    }

    /* ---------- ÁUDIO / VOICE ---------- */
    if(tipo === "audio" || tipo === "voice"){
      const temUrl = !!m.media_url;
      const srcLocal = m._localSrc || "";
      const src = srcLocal || (m._urlAssinada || "");
      const dur = m.media_duration || 0;
      const durTexto = dur > 0 ? formatarDuracao(dur) : "--:--";

      const audioTag = (temUrl || srcLocal)
        ? `<audio preload="none" data-src="${escapeHtml(src)}" data-path="${escapeHtml(m.media_url || '')}"></audio>`
        : `<div style="font-size:12px;color:var(--muted);">Áudio indisponível</div>`;

      // Barras decorativas da onda (geradas a partir do id)
      const barras = gerarBarrasOnda(m.id || "x");

      return `
        <div class="chat-msg ${classe}" data-msg-id="${escapeHtml(m.id || "")}">
          <div class="chat-bubble bubble-audio${erro}">
            <div class="audio-player" data-audio-id="${escapeHtml(m.id || "")}">
              <button class="btn-play" type="button" data-play="${escapeHtml(m.id || "")}">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" data-icon="play">
                  <path d="M8 5v14l11-7z"/>
                </svg>
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" data-icon="pause" style="display:none;">
                  <path d="M6 5h4v14H6zM14 5h4v14h-4z"/>
                </svg>
              </button>
              <div class="onda" data-onda="${escapeHtml(m.id || "")}">
                ${barras}
              </div>
              <div class="tempo" data-tempo="${escapeHtml(m.id || "")}">${escapeHtml(durTexto)}</div>
            </div>
            ${audioTag}
            <div class="meta">
              <span>${escapeHtml(hora)}</span>
              ${statusIcon ? `<span class="status">${statusIcon}</span>` : ""}
            </div>
          </div>
        </div>
      `;
    }

    /* ---------- TEXTO (padrão) ---------- */
    return `
      <div class="chat-msg ${classe}" data-msg-id="${escapeHtml(m.id || "")}">
        <div class="chat-bubble${erro}">
          <div class="texto">${escapeHtml(m.conteudo || "")}</div>
          <div class="meta">
            <span>${escapeHtml(hora)}</span>
            ${statusIcon ? `<span class="status">${statusIcon}</span>` : ""}
          </div>
        </div>
      </div>
    `;
  }

  function gerarBarrasOnda(seed){
    // Gera 24 barras com alturas pseudo-aleatórias determinísticas
    let h = 0;
    for(let i = 0; i < seed.length; i++){
      h = (h * 31 + seed.charCodeAt(i)) >>> 0;
    }
    let html = "";
    const N = 24;
    for(let i = 0; i < N; i++){
      h = (h * 1664525 + 1013904223) >>> 0;
      const alt = 30 + (h % 70); // 30% a 100%
      html += `<span class="barra" style="height:${alt}%"></span>`;
    }
    return html;
  }

  /* =========================================================
     HIDRATAR MÍDIAS (URLs assinadas)
     ========================================================= */
  async function hidratarMidias(){
    const imgs = document.querySelectorAll("img.chat-img[data-path]");
    for(const img of imgs){
      const path = img.getAttribute("data-path");
      const srcAtual = img.getAttribute("src");
      if(path && (!srcAtual || srcAtual === "")){
        const url = await obterUrlAssinada(path);
        if(url) img.src = url;
      }
    }

    const audios = document.querySelectorAll("audio[data-path]");
    for(const a of audios){
      const path = a.getAttribute("data-path");
      if(path && (!a.src || a.src === "" || a.src === window.location.href)){
        const url = await obterUrlAssinada(path);
        if(url) a.setAttribute("src", url);
      }
    }
  }

  /* =========================================================
     AUDIO PLAYER CUSTOMIZADO
     ========================================================= */
  function pararAudioAtivo(exceto){
    if(state.audioPlayerAtivo && state.audioPlayerAtivo !== exceto){
      try{
        state.audioPlayerAtivo.audio.pause();
        state.audioPlayerAtivo.audio.currentTime = 0;
      }catch(e){}
      state.audioPlayerAtivo.btnPlay.querySelector('[data-icon="play"]').style.display = "";
      state.audioPlayerAtivo.btnPlay.querySelector('[data-icon="pause"]').style.display = "none";
      state.audioPlayerAtivo = null;
    }
  }

  document.getElementById("chatContainer").addEventListener("click", async (e) => {
    /* Play/pause do áudio */
    const btnPlay = e.target.closest(".btn-play");
    if(btnPlay){
      const idMsg = btnPlay.getAttribute("data-play");
      const wrap = btnPlay.closest(".audio-player");
      const audio = wrap.parentElement.querySelector("audio");
      const btn = btnPlay;
      const iconPlay = btn.querySelector('[data-icon="play"]');
      const iconPause = btn.querySelector('[data-icon="pause"]');
      const onda = wrap.querySelector(".onda");
      const tempoEl = wrap.querySelector(".tempo");

      if(!audio || !audio.src){
        alert("Áudio ainda carregando...");
        return;
      }

      // Pausa outro player
      pararAudioAtivo(wrap);

      if(audio.paused){
        try{
          await audio.play();
          iconPlay.style.display = "none";
          iconPause.style.display = "";
          state.audioPlayerAtivo = { audio, btnPlay: btn, wrap };

          audio.ontimeupdate = () => {
            const dur = audio.duration || 0;
            const cur = audio.currentTime || 0;
            if(dur > 0){
              const pct = cur / dur;
              const barras = onda.querySelectorAll(".barra");
              const ativas = Math.floor(pct * barras.length);
              barras.forEach((b, i) => {
                if(i <= ativas) b.classList.add("ativa");
                else b.classList.remove("ativa");
              });
              tempoEl.textContent = formatarDuracao(cur);
            }
          };

          audio.onended = () => {
            iconPlay.style.display = "";
            iconPause.style.display = "none";
            onda.querySelectorAll(".barra").forEach(b => b.classList.remove("ativa"));
            const dur = audio.duration || 0;
            tempoEl.textContent = dur > 0 ? formatarDuracao(dur) : "--:--";
            state.audioPlayerAtivo = null;
          };
        }catch(err){
          alert("Não foi possível tocar o áudio.");
        }
      } else {
        audio.pause();
        iconPlay.style.display = "";
        iconPause.style.display = "none";
      }
      return;
    }

    /* Clique na imagem abre tela cheia */
    const img = e.target.closest("img.chat-img");
    if(img && img.src){
      abrirImgFull(img.src);
      return;
    }

    /* Botão de recarregar conversa */
    const btnRecarregar = e.target.closest("#btnRecarregarConversaErro");
    if(btnRecarregar) carregarConversa();
  });

  /* =========================================================
     API: LISTA
     ========================================================= */
  async function carregarConversas(opts){
    opts = opts || {};
    const silencioso = !!opts.silencioso;

    if(!temConfig()) return;

    if(!silencioso){
      state.carregando = true;
      state.erro = null;
      renderLista();
    }

    try{
      const resp = await fetch(urlBase("/conversas"), {
        method: "GET",
        headers: { "x-api-key": state.apiKey }
      });

      const data = await resp.json().catch(() => ({}));
      if(!resp.ok) throw new Error(data.error || ("HTTP " + resp.status));

      state.conversas = Array.isArray(data.conversas) ? data.conversas : [];
      state.erro = null;
    }catch(err){
      state.erro = err.message || "Erro desconhecido";
      if(!silencioso) state.conversas = [];
    }finally{
      state.carregando = false;
      if(!state.telefoneAtual) renderLista();
      atualizarBadge();
    }
  }

  /* =========================================================
     API: CONVERSA
     ========================================================= */
  async function carregarConversa(opts){
    opts = opts || {};
    const silencioso = !!opts.silencioso;

    if(!state.telefoneAtual) return;

    if(!silencioso){
      state.carregandoConversa = true;
      state.erroConversa = null;
      renderConversa();
    }

    try{
      const resp = await fetch(
        urlBase("/conversas/" + encodeURIComponent(state.telefoneAtual)),
        {
          method: "GET",
          headers: { "x-api-key": state.apiKey }
        }
      );

      const data = await resp.json().catch(() => ({}));
      if(!resp.ok) throw new Error(data.error || ("HTTP " + resp.status));

      const novas = Array.isArray(data.mensagens) ? data.mensagens : [];

      const locaisPendentes = state.mensagens.filter(m => m._enviando || m._erro);
      state.mensagens = novas.concat(locaisPendentes);

      const info = calcularJanela24h(state.mensagens);
      state.janelaAberta = info.aberta;
      state.janelaFechaEm = info.fechaEm;

      state.erroConversa = null;
    }catch(err){
      state.erroConversa = err.message || "Erro desconhecido";
    }finally{
      state.carregandoConversa = false;
      if(state.telefoneAtual) renderConversa();
    }
  }

  /* =========================================================
     API: ENVIAR TEXTO
     ========================================================= */
  async function enviarMensagem(){
    const input = document.getElementById("inputMensagem");
    const texto = (input.value || "").trim();
    if(!texto) return;

    if(!state.janelaAberta){
      alert("Janela de 24h fechada. Aguarde a cliente enviar uma nova mensagem.");
      return;
    }

    const msgTemp = {
      id: "temp_" + Date.now(),
      direcao: "enviada",
      conteudo: texto,
      tipo: "text",
      enviado_em: new Date().toISOString(),
      _enviando: true
    };

    state.mensagens.push(msgTemp);
    state.enviando = true;
    input.value = "";
    input.style.height = "auto";
    renderConversa();

    try{
      const resp = await fetch(urlBase("/responder"), {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": state.apiKey
        },
        body: JSON.stringify({
          telefone: state.telefoneAtual,
          mensagem: texto,
          type: "text"
        })
      });

      const data = await resp.json().catch(() => ({}));
      if(!resp.ok) throw new Error(data.error || ("HTTP " + resp.status));

      msgTemp._enviando = false;
      await carregarConversa({ silencioso: true });
    }catch(err){
      msgTemp._enviando = false;
      msgTemp._erro = true;
      renderConversa();
      alert("Erro ao enviar: " + err.message);
    }finally{
      state.enviando = false;
      renderConversa();
    }
  }

    const resp = await fetch(urlBase("/upload-media"), {
      method: "POST",

  /* =========================================================
     ÁUDIO — gravação via MediaRecorder
     ========================================================= */
  function escolherMimeAudio(){
    const candidatos = [
      "audio/webm;codecs=opus",
      "audio/webm",
      "audio/mp4",
      "audio/ogg;codecs=opus"
    ];
    if(typeof MediaRecorder === "undefined" || !MediaRecorder.isTypeSupported) return "";
    for(const m of candidatos){
      if(MediaRecorder.isTypeSupported(m)) return m;
    }
    return "";
  }

  async function iniciarGravacao(){
    if(state.gravando) return;
    if(!state.janelaAberta){
      alert("Janela de 24h fechada.");
      return;
    }
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      alert("Este navegador não suporta gravação de áudio.");
      return;
    }

    try{
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      state.streamAudio = stream;

      const mime = escolherMimeAudio();
      const options = mime ? { mimeType: mime } : undefined;

      let recorder;
      try{
        recorder = new MediaRecorder(stream, options);
      }catch(e){
        recorder = new MediaRecorder(stream);
      }

      state.mediaRecorder = recorder;
      state.chunksAudio = [];
      state.inicioGravacao = Date.now();
      state.gravando = true;

      recorder.ondataavailable = (e) => {
        if(e.data && e.data.size > 0) state.chunksAudio.push(e.data);
      };

      recorder.onstop = () => {
        // tratado depois
      };

      recorder.start();

      // UI de gravação
      document.getElementById("chatInputBar").classList.add("gravando");
      atualizarTempoGravacao();

      state.timerGravacao = setInterval(atualizarTempoGravacao, 200);

    }catch(err){
      console.error("[audio] erro:", err);
      alert("Não foi possível acessar o microfone. Verifique as permissões.");
      pararStreamAudio();
      state.gravando = false;
    }
  }

  function atualizarTempoGravacao(){
    const el = document.getElementById("tempoGrav");
    if(!el) return;
    const seg = Math.floor((Date.now() - state.inicioGravacao) / 1000);
    el.textContent = formatarDuracao(seg);
  }

  function pararStreamAudio(){
    if(state.streamAudio){
      try{
        state.streamAudio.getTracks().forEach(t => t.stop());
      }catch(e){}
      state.streamAudio = null;
    }
  }

  function cancelarGravacao(){
    if(!state.gravando) return;

    try{
      if(state.mediaRecorder && state.mediaRecorder.state !== "inactive"){
        state.mediaRecorder.onstop = null;
        state.mediaRecorder.stop();
      }
    }catch(e){}

    state.chunksAudio = [];
    state.gravando = false;

    if(state.timerGravacao){
      clearInterval(state.timerGravacao);
      state.timerGravacao = null;
    }

    document.getElementById("chatInputBar").classList.remove("gravando");
    pararStreamAudio();
  }

  async function finalizarGravacaoEEnviar(){
    if(!state.gravando) return;

    const duracaoSeg = Math.max(1, Math.round((Date.now() - state.inicioGravacao) / 1000));

    // Para o recorder e espera o último chunk
    const recorder = state.mediaRecorder;
    const chunks = state.chunksAudio;

    await new Promise((resolve) => {
      if(!recorder || recorder.state === "inactive"){
        resolve();
        return;
      }
      recorder.onstop = () => resolve();
      try{
        recorder.stop();
      }catch(e){ resolve(); }
    });

    // Finaliza estado
    state.gravando = false;
    if(state.timerGravacao){
      clearInterval(state.timerGravacao);
      state.timerGravacao = null;
    }
    document.getElementById("chatInputBar").classList.remove("gravando");
    pararStreamAudio();

    if(!chunks.length){
      alert("Gravação vazia. Tente novamente.");
      return;
    }

    const blob = new Blob(chunks, { type: chunks[0].type || "audio/webm" });

    if(blob.size > LIMITE_AUDIO){
      alert("Áudio acima de 16 MB. Grave um mais curto.");
      return;
    }

    // Bolha otimista (com duração)
    const tempId = "temp_aud_" + Date.now();
    const localUrl = URL.createObjectURL(blob);

    const msgTemp = {
      id: tempId,
      direcao: "enviada",
      conteudo: "[Mensagem de voz]",
      tipo: "voice",
      enviado_em: new Date().toISOString(),
      media_duration: duracaoSeg,
      _enviando: true,
      _localSrc: localUrl
    };
    state.mensagens.push(msgTemp);
    state.enviando = true;
    renderConversa();

    try{
      const ext = (blob.type.indexOf("mp4") >= 0) ? "m4a"
                : (blob.type.indexOf("ogg") >= 0) ? "ogg"
                : "webm";

      const up = await uploadMidia(blob, "audio." + ext, "audio");

      const resp = await fetch(urlBase("/responder"), {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": state.apiKey
        },
        body: JSON.stringify({
          telefone: state.telefoneAtual,
          type: "voice",
          mediaId: up.mediaId,
          mediaUrl: up.mediaUrl,
          mediaMime: up.mediaMime,
          mediaDuration: up.mediaDuration || duracaoSeg
        })
      });

      const data = await resp.json().catch(() => ({}));
      if(!resp.ok) throw new Error(data.error || ("HTTP " + resp.status));

      msgTemp._enviando = false;
      try{ URL.revokeObjectURL(localUrl); }catch(e){}
      await carregarConversa({ silencioso: true });
    }catch(err){
      msgTemp._enviando = false;
      msgTemp._erro = true;
      renderConversa();
      alert("Erro ao enviar áudio: " + err.message);
    }finally{
      state.enviando = false;
      renderConversa();
    }
  }

  // Botões de gravação
  document.getElementById("btnGravar").addEventListener("click", () => {
    iniciarGravacao();
  });
  document.getElementById("btnPararGrav").addEventListener("click", () => {
    finalizarGravacaoEEnviar();
  });
  document.getElementById("btnCancelarGrav").addEventListener("click", () => {
    cancelarGravacao();
  });

  /* =========================================================
     EVENTOS: LISTA
     ========================================================= */
  document.getElementById("btnConfig").addEventListener("click", () => {
    document.getElementById("cfgBackendUrl").value = state.backendUrl || "";
    document.getElementById("cfgApiKey").value = state.apiKey || "";
    atualizarPushUI();
    openOverlay("overlayConfig");
  });

  document.getElementById("btnSalvarConfig").addEventListener("click", () => {
    const url = document.getElementById("cfgBackendUrl").value.trim();
    const key = document.getElementById("cfgApiKey").value.trim();

    if(!url || !key){ alert("Preencha os dois campos."); return; }
    if(!/^https?:\/\//i.test(url)){ alert("A URL deve começar com http:// ou https://"); return; }

    state.backendUrl = url.replace(/\/+$/, "");
    state.apiKey = key;
    saveConfig();

    closeOverlay("overlayConfig");
    carregarConversas();
  });

  document.getElementById("btnReload").addEventListener("click", () => {
    const btn = document.getElementById("btnReload");
    btn.classList.add("girando");
    carregarConversas().finally(() => {
      setTimeout(() => btn.classList.remove("girando"), 400);
    });
  });

  document.getElementById("content").addEventListener("click", e => {
    const btnConfigInicial = e.target.closest("#btnAbrirConfigInicial");
    if(btnConfigInicial){ document.getElementById("btnConfig").click(); return; }

    const btnRecarregarVazio = e.target.closest("#btnRecarregarVazio");
    if(btnRecarregarVazio){ carregarConversas(); return; }

    const btnRecarregarErro = e.target.closest("#btnRecarregarErro");
    if(btnRecarregarErro){ carregarConversas(); return; }

    const conversa = e.target.closest(".conversa");
    if(conversa){
      const tel = conversa.getAttribute("data-telefone");
      const nome = conversa.getAttribute("data-cliente");
      mostrarConversa(tel, nome);
    }
  });

  /* =========================================================
     EVENTOS: CONVERSA
     ========================================================= */
  document.getElementById("btnVoltar").addEventListener("click", mostrarLista);

  document.getElementById("btnReloadConversa").addEventListener("click", () => {
    carregarConversa();
  });

  const inputMensagem = document.getElementById("inputMensagem");
  const btnEnviar = document.getElementById("btnEnviar");

  inputMensagem.addEventListener("input", () => {
    inputMensagem.style.height = "auto";
    inputMensagem.style.height = Math.min(inputMensagem.scrollHeight, 100) + "px";
    btnEnviar.disabled = state.enviando || !inputMensagem.value.trim();
  });

  btnEnviar.addEventListener("click", enviarMensagem);

  // Enter sem shift envia
  inputMensagem.addEventListener("keydown", (e) => {
    if(e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      if(!btnEnviar.disabled) enviarMensagem();
    }
  });

  /* =========================================================
     VISIBILITY CHANGE
     ========================================================= */
  document.addEventListener("visibilitychange", () => {
    if(document.visibilityState === "visible" && temConfig()){
      atualizarBadge();
      if(state.telefoneAtual){
        carregarConversa({ silencioso: true });
      } else {
        carregarConversas({ silencioso: true });
      }
    }
  });

  /* =========================================================
     SERVICE WORKER: mensagens (deep-link)
     ========================================================= */
  if("serviceWorker" in navigator){
    navigator.serviceWorker.addEventListener("message", (event) => {
      const data = event.data || {};
      if(data.type === "abrirConversa" && data.telefone){
        mostrarConversa(data.telefone, data.cliente || "Cliente");
      }
    });
  }

  /* =========================================================
     DEEP-LINK via URL
     ========================================================= */
  function checarDeepLink(){
    const params = new URLSearchParams(window.location.search);
    const tel = params.get("tel");
    const cliente = params.get("cliente") || "Cliente";

    if(tel && temConfig()){
      try{
        const urlLimpa = window.location.pathname + window.location.hash;
        window.history.replaceState({}, "", urlLimpa);
      }catch(e){}

      setTimeout(() => {
        mostrarConversa(tel, cliente);
      }, 300);
      return true;
    }
    return false;
  }

  /* =========================================================
     BOOT
     ========================================================= */
  async function boot(){
    loadConfig();
    renderLista();

    if("serviceWorker" in navigator){
      try{
        state.swRegistration = await registrarServiceWorker();
        await verificarSubscriptionExistente();
      }catch(e){}
    }

    atualizarPushUI();

    if(temConfig()){
      const temDeepLink = checarDeepLink();

      if(!temDeepLink){
        carregarConversas();
        iniciarRefreshLista();
      }

      atualizarBadge();
    }
  }

  boot();
})();
</script>
</body>
</html>
