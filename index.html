<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Mila Whats</title>

<script>
  (function(){
    try{
      var salvo = localStorage.getItem("mila_whats_tema");
      var tema;
      if(salvo === "dark" || salvo === "light"){
        tema = salvo;
      } else {
        tema = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", tema);
    }catch(e){}
  })();
</script>

<meta name="theme-color" content="#7b1e3a">
<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.json">

<link rel="icon" type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237b1e3a'/%3E%3Cpath d='M8 10 h16 v10 h-10 l-4 4 v-4 h-2 z' fill='%23ffffff'/%3E%3C/svg%3E">

<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Mila Whats">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
  :root{
    --bg:#faf7f5;
    --surface:#ffffff;
    --primary:#a02850;
    --primary-dark:#7b1e3a;
    --text:#2b2b2b;
    --muted:#8a7f7a;
    --border:#e8e2de;
    --header-h:52px;
    --msg-enviada:#dcf8c6;
    --msg-enviada-text:#1a1a1a;
    --msg-recebida:#ffffff;
    --msg-recebida-text:#2b2b2b;
    --aviso-24h:#fff3e0;
    --aviso-24h-borda:#f0a800;
    --aviso-24h-text:#6b5200;
    --btn-bg:#f5efec;
    --btn-active:#ece2dc;
    --input-bg:#ffffff;
    --input-bg-alt:#faf7f5;
    --overlay-bg:rgba(0,0,0,.45);
  }

  html[data-theme="dark"]{
    --bg:#1a1a1a;
    --surface:#262626;
    --primary:#c03060;
    --primary-dark:#a02850;
    --text:#e8e8e8;
    --muted:#9a9a9a;
    --border:#3a3a3a;
    --msg-enviada:#1e3a20;
    --msg-enviada-text:#e8e8e8;
    --msg-recebida:#262626;
    --msg-recebida-text:#e8e8e8;
    --aviso-24h:#3a2e18;
    --aviso-24h-borda:#d99a00;
    --aviso-24h-text:#f0d580;
    --btn-bg:#333333;
    --btn-active:#404040;
    --input-bg:#2a2a2a;
    --input-bg-alt:#2a2a2a;
    --overlay-bg:rgba(0,0,0,.7);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

  html, body{
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
    overscroll-behavior:none;
  }

  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    position:fixed;
    inset:0;
    touch-action:manipulation;
  }

  header.app-header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:var(--header-h);
    padding-top:env(safe-area-inset-top);
    box-sizing:content-box;
    background:var(--primary);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding-left:16px;
    padding-right:12px;
    font-weight:700;
    font-size:18px;
    letter-spacing:1px;
    z-index:10;
    box-shadow:0 1px 3px rgba(0,0,0,.15);
  }

  header.app-header .header-title{
    flex:1;
  }

  header.app-header .header-btn{
    background:transparent;
    border:none;
    color:#fff;
    font-size:22px;
    cursor:pointer;
    padding:8px;
    line-height:1;
    border-radius:50%;
  }

  header.app-header .header-btn:active{
    background:rgba(255,255,255,.15);
  }

  .content{
    position:fixed;
    left:0;
    right:0;
    top:calc(var(--header-h) + env(safe-area-inset-top));
    bottom:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
  }

  /* Botão flutuante de recarregar */
  .btn-float{
    position:fixed;
    bottom:calc(16px + env(safe-area-inset-bottom));
    right:16px;
    width:44px;
    height:44px;
    border-radius:50%;
    background:var(--primary);
    color:#fff;
    border:none;
    font-size:20px;
    cursor:pointer;
    box-shadow:0 3px 8px rgba(0,0,0,.25);
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    transition:transform .2s;
  }
  .btn-float:active{
    transform:scale(.94);
  }
  .btn-float.girando{
    animation:girar .8s linear infinite;
  }
  @keyframes girar{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(360deg); }
  }

  /* Lista de conversas */
  .lista{
    padding:0;
  }

  .conversa{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 16px;
    border-bottom:1px solid var(--border);
    background:var(--surface);
    cursor:pointer;
    transition:background .15s;
  }
  .conversa:active{
    background:var(--btn-active);
  }

  .conversa .avatar{
    width:48px;
    height:48px;
    border-radius:50%;
    background:var(--primary);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    font-weight:700;
    flex:0 0 auto;
    text-transform:uppercase;
  }

  .conversa .info{
    flex:1;
    min-width:0;
  }

  .conversa .linha1{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:8px;
    margin-bottom:2px;
  }

  .conversa .nome{
    font-size:15px;
    font-weight:600;
    color:var(--text);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    flex:1;
  }

  .conversa .horario{
    font-size:11px;
    color:var(--muted);
    flex:0 0 auto;
  }

  .conversa .linha2{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
  }

  .conversa .ultima{
    font-size:13px;
    color:var(--muted);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    flex:1;
  }

  .conversa .ultima.enviada::before{
    content:"Você: ";
    color:var(--primary);
    font-weight:600;
  }

  /* Estado vazio */
  .vazio{
    text-align:center;
    padding:80px 24px;
    color:var(--muted);
  }

  .vazio .icone{
    font-size:72px;
    margin-bottom:20px;
    opacity:.4;
  }

  .vazio .titulo{
    font-size:18px;
    font-weight:700;
    color:var(--text);
    margin-bottom:8px;
  }

  .vazio .texto{
    font-size:14px;
    line-height:1.5;
    margin-bottom:24px;
  }

  .vazio .btn{
    background:var(--primary);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:12px 24px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }

  .vazio .btn:active{
    background:var(--primary-dark);
  }

  /* Estado de carregamento */
  .carregando{
    text-align:center;
    padding:80px 24px;
    color:var(--muted);
  }

  .carregando .spinner{
    width:44px;
    height:44px;
    border:3px solid var(--border);
    border-top-color:var(--primary);
    border-radius:50%;
    margin:0 auto 16px;
    animation:girar .8s linear infinite;
  }

  /* Estado de erro */
  .erro{
    text-align:center;
    padding:60px 24px;
    color:var(--muted);
  }

  .erro .icone{
    font-size:56px;
    margin-bottom:16px;
    color:#c62828;
  }

  .erro .titulo{
    font-size:16px;
    font-weight:700;
    color:var(--text);
    margin-bottom:8px;
  }

  .erro .texto{
    font-size:13px;
    line-height:1.5;
    margin-bottom:20px;
    word-break:break-word;
  }

  .erro .btn{
    background:var(--primary);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:10px 20px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }

  /* Overlay */
  .overlay{
    position:fixed;
    inset:0;
    background:var(--overlay-bg);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:100;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .overlay.show{
    display:flex;
  }

  .sheet{
    background:var(--surface);
    width:100%;
    max-width:520px;
    max-height:88vh;
    border-radius:16px 16px 0 0;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    animation:slideUp .2s ease;
  }
  @keyframes slideUp{
    from{ transform:translateY(20px); opacity:.6; }
    to{ transform:translateY(0); opacity:1; }
  }

  .sheet-header{
    padding:14px 16px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex:0 0 auto;
  }
  .sheet-title{
    font-size:16px;
    font-weight:700;
    color:var(--text);
  }
  .sheet-close{
    background:transparent;
    border:none;
    font-size:22px;
    color:var(--muted);
    cursor:pointer;
    padding:0 4px;
    line-height:1;
  }

  .sheet-body{
    flex:1 1 auto;
    overflow-y:auto;
    padding:16px;
  }
  .sheet-footer{
    flex:0 0 auto;
    padding:12px 16px;
    border-top:1px solid var(--border);
    display:flex;
    gap:8px;
  }

  .form-group{
    margin-bottom:14px;
  }
  .form-group label{
    display:block;
    font-size:12px;
    font-weight:600;
    color:var(--muted);
    margin-bottom:6px;
    text-transform:uppercase;
    letter-spacing:.5px;
  }
  .form-group input{
    width:100%;
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px 14px;
    font-size:15px;
    font-family:inherit;
    background:var(--input-bg);
    color:var(--text);
    outline:none;
    transition:border .15s;
  }
  .form-group input:focus{
    border-color:var(--primary);
  }

  .form-aviso{
    font-size:12px;
    color:var(--muted);
    line-height:1.5;
    margin-bottom:16px;
    padding:10px 12px;
    background:var(--input-bg-alt);
    border-radius:8px;
  }

  .btn{
    border:none;
    border-radius:8px;
    font-size:15px;
    font-weight:600;
    padding:12px 16px;
    cursor:pointer;
    transition:background .15s;
    flex:1;
  }
  .btn-primary{
    background:var(--primary);
    color:#fff;
  }
  .btn-primary:active{
    background:var(--primary-dark);
  }
  .btn-primary:disabled{
    opacity:.5;
    cursor:not-allowed;
  }
  .btn-secondary{
    background:var(--btn-bg);
    color:var(--text);
  }
  .btn-secondary:active{
    background:var(--btn-active);
  }

  ::-webkit-scrollbar{ width:0; height:0; }
</style>
</head>
<body>

<header class="app-header">
  <span class="header-title">💬 Mila Whats</span>
  <button class="header-btn" id="btnConfig" aria-label="Configurações">⚙️</button>
</header>

<div class="content" id="content">
  <!-- conteúdo é renderizado pelo JavaScript -->
</div>

<button class="btn-float" id="btnReload" aria-label="Recarregar" style="display:none;">🔄</button>

<!-- OVERLAY: CONFIGURAÇÕES -->
<div class="overlay" id="overlayConfig">
  <div class="sheet">
    <div class="sheet-header">
      <div class="sheet-title">Configurações</div>
      <button class="sheet-close" data-close="overlayConfig">✕</button>
    </div>
    <div class="sheet-body">
      <div class="form-aviso">
        💡 Preencha com os dados do backend Mila Nails. Essas informações
        ficam salvas apenas neste aparelho.
      </div>
      <div class="form-group">
        <label for="cfgBackendUrl">URL do backend</label>
        <input type="url" id="cfgBackendUrl" placeholder="https://mila-nails-backend.onrender.com" autocomplete="off">
      </div>
      <div class="form-group">
        <label for="cfgApiKey">API Key</label>
        <input type="password" id="cfgApiKey" placeholder="mila_nails_sk_..." autocomplete="off">
      </div>
    </div>
    <div class="sheet-footer">
      <button class="btn btn-secondary" data-close="overlayConfig">Cancelar</button>
      <button class="btn btn-primary" id="btnSalvarConfig">Salvar</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  const LS_CONFIG = "mila_whats_config";
  const LS_TEMA   = "mila_whats_tema";

  /* =========================================================
     ESTADO
     ========================================================= */
  let state = {
    backendUrl: "",
    apiKey: "",
    conversas: [],
    carregando: false,
    erro: null,
    primeiraConfig: false
  };

  /* =========================================================
     PERSISTÊNCIA
     ========================================================= */
  function loadConfig(){
    try{
      const raw = JSON.parse(localStorage.getItem(LS_CONFIG) || "null");
      if(raw && typeof raw === "object"){
        state.backendUrl = typeof raw.backendUrl === "string" ? raw.backendUrl : "";
        state.apiKey     = typeof raw.apiKey === "string" ? raw.apiKey : "";
      }
    }catch(e){}
  }

  function saveConfig(){
    localStorage.setItem(LS_CONFIG, JSON.stringify({
      backendUrl: state.backendUrl,
      apiKey: state.apiKey
    }));
  }

  function temConfig(){
    return !!(state.backendUrl && state.apiKey);
  }

  /* =========================================================
     HELPERS
     ========================================================= */
  function escapeHtml(s){
    if(s === undefined || s === null) return "";
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function iniciais(nome){
    if(!nome) return "?";
    const partes = nome.trim().split(/\s+/);
    if(partes.length === 1){
      return partes[0].slice(0, 2).toUpperCase();
    }
    return (partes[0][0] + partes[partes.length - 1][0]).toUpperCase();
  }

  function formatarHorario(iso){
    if(!iso) return "";
    const d = new Date(iso);
    const agora = new Date();
    const mesmoDia = d.toDateString() === agora.toDateString();

    const ontem = new Date(agora);
    ontem.setDate(ontem.getDate() - 1);
    const ehOntem = d.toDateString() === ontem.toDateString();

    const hh = String(d.getHours()).padStart(2, "0");
    const mm = String(d.getMinutes()).padStart(2, "0");

    if(mesmoDia) return hh + ":" + mm;
    if(ehOntem)  return "ontem";
    return String(d.getDate()).padStart(2, "0") + "/" +
           String(d.getMonth() + 1).padStart(2, "0");
  }

  /* =========================================================
     OVERLAYS
     ========================================================= */
  function openOverlay(id){
    document.getElementById(id).classList.add("show");
  }
  function closeOverlay(id){
    document.getElementById(id).classList.remove("show");
  }

  document.querySelectorAll("[data-close]").forEach(btn => {
    btn.addEventListener("click", () => {
      closeOverlay(btn.getAttribute("data-close"));
    });
  });
  document.querySelectorAll(".overlay").forEach(ov => {
    ov.addEventListener("click", e => {
      if(e.target === ov) closeOverlay(ov.id);
    });
  });

  /* =========================================================
     RENDER
     ========================================================= */
  function render(){
    const content = document.getElementById("content");
    const btnReload = document.getElementById("btnReload");

    // Esconde o botão de recarregar por padrão
    btnReload.style.display = "none";

    // Sem config → mostra tela inicial de configuração
    if(!temConfig()){
      content.innerHTML = renderSemConfig();
      btnReload.style.display = "none";
      return;
    }

    // Com config mas carregando
    if(state.carregando){
      content.innerHTML = renderCarregando();
      btnReload.style.display = "flex";
      return;
    }

    // Com config mas com erro
    if(state.erro){
      content.innerHTML = renderErro(state.erro);
      btnReload.style.display = "flex";
      return;
    }

    // Sem conversas
    if(!state.conversas || state.conversas.length === 0){
      content.innerHTML = renderVazio();
      btnReload.style.display = "flex";
      return;
    }

    // Com conversas
    content.innerHTML = renderLista(state.conversas);
    btnReload.style.display = "flex";
  }

  function renderSemConfig(){
    return `
      <div class="vazio">
        <div class="icone">⚙️</div>
        <div class="titulo">Bem-vindo ao Mila Whats</div>
        <div class="texto">
          Para começar, configure a conexão com o backend
          tocando no ícone de engrenagem no topo da tela.
        </div>
        <button class="btn" id="btnAbrirConfigInicial">
          Abrir configurações
        </button>
      </div>
    `;
  }

  function renderCarregando(){
    return `
      <div class="carregando">
        <div class="spinner"></div>
        <div>Carregando conversas...</div>
      </div>
    `;
  }

  function renderVazio(){
    return `
      <div class="vazio">
        <div class="icone">💬</div>
        <div class="titulo">Sem conversas por enquanto</div>
        <div class="texto">
          As mensagens aparecerão aqui automaticamente
          quando as clientes responderem aos lembretes.
        </div>
        <button class="btn" id="btnRecarregarVazio">
          🔄 Recarregar
        </button>
      </div>
    `;
  }

  function renderErro(msg){
    return `
      <div class="erro">
        <div class="icone">⚠️</div>
        <div class="titulo">Não foi possível carregar</div>
        <div class="texto">${escapeHtml(msg)}</div>
        <button class="btn" id="btnRecarregarErro">
          Tentar novamente
        </button>
      </div>
    `;
  }

  function renderLista(conversas){
    let html = '<div class="lista">';
    conversas.forEach(c => {
      const nome = c.cliente || "Cliente";
      const ultima = c.ultima_mensagem || "(sem mensagem)";
      const ehEnviada = c.ultima_direcao === "enviada";
      const horario = formatarHorario(c.ultima_data);

      html += `
        <div class="conversa" data-telefone="${escapeHtml(c.telefone)}">
          <div class="avatar">${escapeHtml(iniciais(nome))}</div>
          <div class="info">
            <div class="linha1">
              <div class="nome">${escapeHtml(nome)}</div>
              <div class="horario">${escapeHtml(horario)}</div>
            </div>
            <div class="linha2">
              <div class="ultima ${ehEnviada ? 'enviada' : ''}">${escapeHtml(ultima)}</div>
            </div>
          </div>
        </div>
      `;
    });
    html += "</div>";
    return html;
  }

  /* =========================================================
     CARREGAR CONVERSAS DO BACKEND
     ========================================================= */
  async function carregarConversas(){
    if(!temConfig()) return;

    state.carregando = true;
    state.erro = null;
    render();

    try{
      const url = state.backendUrl.replace(/\/+$/, "") + "/conversas";
      const resp = await fetch(url, {
        method: "GET",
        headers: { "x-api-key": state.apiKey }
      });

      const data = await resp.json().catch(() => ({}));

      if(!resp.ok){
        throw new Error(data.error || ("HTTP " + resp.status));
      }

      state.conversas = Array.isArray(data.conversas) ? data.conversas : [];
      state.erro = null;
    }catch(err){
      state.erro = err.message || "Erro desconhecido";
      state.conversas = [];
    }finally{
      state.carregando = false;
      render();
    }
  }

  /* =========================================================
     EVENTOS
     ========================================================= */
  document.getElementById("btnConfig").addEventListener("click", () => {
    document.getElementById("cfgBackendUrl").value = state.backendUrl || "";
    document.getElementById("cfgApiKey").value = state.apiKey || "";
    openOverlay("overlayConfig");
  });

  document.getElementById("btnSalvarConfig").addEventListener("click", () => {
    const url = document.getElementById("cfgBackendUrl").value.trim();
    const key = document.getElementById("cfgApiKey").value.trim();

    if(!url || !key){
      alert("Preencha os dois campos.");
      return;
    }

    if(!/^https?:\/\//i.test(url)){
      alert("A URL deve começar com http:// ou https://");
      return;
    }

    state.backendUrl = url.replace(/\/+$/, "");
    state.apiKey = key;
    saveConfig();

    closeOverlay("overlayConfig");
    carregarConversas();
  });

  document.getElementById("btnReload").addEventListener("click", () => {
    const btn = document.getElementById("btnReload");
    btn.classList.add("girando");
    carregarConversas().finally(() => {
      setTimeout(() => btn.classList.remove("girando"), 400);
    });
  });

  // Delegação de eventos (funciona mesmo com o conteúdo sendo re-renderizado)
  document.getElementById("content").addEventListener("click", e => {
    const btnConfigInicial = e.target.closest("#btnAbrirConfigInicial");
    if(btnConfigInicial){
      document.getElementById("btnConfig").click();
      return;
    }

    const btnRecarregarVazio = e.target.closest("#btnRecarregarVazio");
    if(btnRecarregarVazio){
      carregarConversas();
      return;
    }

    const btnRecarregarErro = e.target.closest("#btnRecarregarErro");
    if(btnRecarregarErro){
      carregarConversas();
      return;
    }

    const conversa = e.target.closest(".conversa");
    if(conversa){
      const tel = conversa.getAttribute("data-telefone");
      alert("Abrir conversa com " + tel + " — será implementado na Fase 8.");
    }
  });

  /* =========================================================
     BOOT
     ========================================================= */
  function boot(){
    loadConfig();
    render();

    if(temConfig()){
      carregarConversas();
    }
  }

  boot();
})();
</script>
</body>
</html>
