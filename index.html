<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Mila Whats</title>

<script>
  (function(){
    try{
      var salvo = localStorage.getItem("mila_whats_tema");
      var tema;
      if(salvo === "dark" || salvo === "light"){
        tema = salvo;
      } else {
        tema = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", tema);
    }catch(e){}
  })();
</script>

<meta name="theme-color" content="#7b1e3a">
<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.json">

<link rel="icon" type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237b1e3a'/%3E%3Cpath d='M8 10 h16 v10 h-10 l-4 4 v-4 h-2 z' fill='%23ffffff'/%3E%3C/svg%3E">

<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Mila Whats">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
  :root{
    --bg:#faf7f5;
    --surface:#ffffff;
    --primary:#a02850;
    --primary-dark:#7b1e3a;
    --text:#2b2b2b;
    --muted:#8a7f7a;
    --border:#e8e2de;
    --header-h:52px;
    --msg-enviada:#dcf8c6;
    --msg-enviada-text:#1a1a1a;
    --msg-recebida:#ffffff;
    --msg-recebida-text:#2b2b2b;
    --aviso-24h:#fff3e0;
    --aviso-24h-borda:#f0a800;
    --aviso-24h-text:#6b5200;
    --btn-bg:#f5efec;
    --btn-active:#ece2dc;
    --input-bg:#ffffff;
    --input-bg-alt:#faf7f5;
    --overlay-bg:rgba(0,0,0,.45);
    --chat-bg:#efe6e1;
    --chat-bubble-enviada:#dcf8c6;
    --chat-bubble-recebida:#ffffff;
    --chat-bubble-erro:#ffcdd2;
  }

  html[data-theme="dark"]{
    --bg:#1a1a1a;
    --surface:#262626;
    --primary:#c03060;
    --primary-dark:#a02850;
    --text:#e8e8e8;
    --muted:#9a9a9a;
    --border:#3a3a3a;
    --msg-enviada:#1e3a20;
    --msg-enviada-text:#e8e8e8;
    --msg-recebida:#262626;
    --msg-recebida-text:#e8e8e8;
    --aviso-24h:#3a2e18;
    --aviso-24h-borda:#d99a00;
    --aviso-24h-text:#f0d580;
    --btn-bg:#333333;
    --btn-active:#404040;
    --input-bg:#2a2a2a;
    --input-bg-alt:#2a2a2a;
    --overlay-bg:rgba(0,0,0,.7);
    --chat-bg:#141414;
    --chat-bubble-enviada:#1e4a20;
    --chat-bubble-recebida:#2e2e2e;
    --chat-bubble-erro:#4a1e1e;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

  html, body{
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
    overscroll-behavior:none;
  }

  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    position:fixed;
    inset:0;
    touch-action:manipulation;
  }

  /* =========================================================
     TELA PRINCIPAL (LISTA DE CONVERSAS)
     ========================================================= */
  header.app-header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:var(--header-h);
    padding-top:env(safe-area-inset-top);
    box-sizing:content-box;
    background:var(--primary);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding-left:16px;
    padding-right:12px;
    font-weight:700;
    font-size:18px;
    letter-spacing:1px;
    z-index:10;
    box-shadow:0 1px 3px rgba(0,0,0,.15);
  }

  header.app-header .header-title{
    flex:1;
    display:flex;
    align-items:center;
    gap:8px;
  }

  header.app-header .header-title .nome-conversa{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  header.app-header .header-btn{
    background:transparent;
    border:none;
    color:#fff;
    font-size:22px;
    cursor:pointer;
    padding:8px;
    line-height:1;
    border-radius:50%;
  }

  header.app-header .header-btn:active{
    background:rgba(255,255,255,.15);
  }

  header.app-header .header-voltar{
    margin-right:4px;
    font-size:24px;
    padding:4px 8px;
  }

  .content{
    position:fixed;
    left:0;
    right:0;
    top:calc(var(--header-h) + env(safe-area-inset-top));
    bottom:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
  }

  /* Botão flutuante de recarregar */
  .btn-float{
    position:fixed;
    bottom:calc(16px + env(safe-area-inset-bottom));
    right:16px;
    width:44px;
    height:44px;
    border-radius:50%;
    background:var(--primary);
    color:#fff;
    border:none;
    font-size:20px;
    cursor:pointer;
    box-shadow:0 3px 8px rgba(0,0,0,.25);
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    transition:transform .2s;
  }
  .btn-float:active{
    transform:scale(.94);
  }
  .btn-float.girando{
    animation:girar .8s linear infinite;
  }
  @keyframes girar{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(360deg); }
  }

  /* Lista de conversas */
  .lista{
    padding:0;
  }

  .conversa{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 16px;
    border-bottom:1px solid var(--border);
    background:var(--surface);
    cursor:pointer;
    transition:background .15s;
  }
  .conversa:active{
    background:var(--btn-active);
  }

  .conversa .avatar{
    width:48px;
    height:48px;
    border-radius:50%;
    background:var(--primary);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    font-weight:700;
    flex:0 0 auto;
    text-transform:uppercase;
  }

  .conversa .info{
    flex:1;
    min-width:0;
  }

  .conversa .linha1{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:8px;
    margin-bottom:2px;
  }

  .conversa .nome{
    font-size:15px;
    font-weight:600;
    color:var(--text);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    flex:1;
  }

  .conversa .horario{
    font-size:11px;
    color:var(--muted);
    flex:0 0 auto;
  }

  .conversa .ultima{
    font-size:13px;
    color:var(--muted);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .conversa .ultima.enviada::before{
    content:"Você: ";
    color:var(--primary);
    font-weight:600;
  }

  /* Estados: vazio, carregando, erro */
  .vazio, .carregando, .erro{
    text-align:center;
    padding:80px 24px;
    color:var(--muted);
  }

  .vazio .icone, .erro .icone{
    font-size:72px;
    margin-bottom:20px;
    opacity:.4;
  }
  .erro .icone{
    opacity:1;
    color:#c62828;
    font-size:56px;
  }

  .vazio .titulo, .erro .titulo{
    font-size:18px;
    font-weight:700;
    color:var(--text);
    margin-bottom:8px;
  }

  .vazio .texto, .erro .texto{
    font-size:14px;
    line-height:1.5;
    margin-bottom:24px;
  }

  .vazio .btn, .erro .btn{
    background:var(--primary);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:12px 24px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }

  .carregando .spinner{
    width:44px;
    height:44px;
    border:3px solid var(--border);
    border-top-color:var(--primary);
    border-radius:50%;
    margin:0 auto 16px;
    animation:girar .8s linear infinite;
  }

  /* =========================================================
     TELA DE CONVERSA INDIVIDUAL
     ========================================================= */
  .chat-container{
    position:fixed;
    left:0;
    right:0;
    top:calc(var(--header-h) + env(safe-area-inset-top));
    bottom:calc(64px + env(safe-area-inset-bottom));
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    background:var(--chat-bg);
    padding:12px 8px;
    overscroll-behavior:contain;
  }

  .chat-aviso-24h{
    background:var(--aviso-24h);
    border:1px solid var(--aviso-24h-borda);
    color:var(--aviso-24h-text);
    border-radius:8px;
    padding:10px 12px;
    font-size:12px;
    line-height:1.4;
    margin:0 8px 12px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .chat-aviso-24h .icone{
    font-size:16px;
    flex:0 0 auto;
  }

  .chat-msg{
    display:flex;
    margin-bottom:8px;
    padding:0 4px;
  }

  .chat-msg.recebida{
    justify-content:flex-start;
  }

  .chat-msg.enviada{
    justify-content:flex-end;
  }

  .chat-bubble{
    max-width:80%;
    padding:8px 12px 6px;
    border-radius:12px;
    font-size:14px;
    line-height:1.4;
    word-wrap:break-word;
    box-shadow:0 1px 2px rgba(0,0,0,.08);
    position:relative;
  }

  .chat-msg.recebida .chat-bubble{
    background:var(--chat-bubble-recebida);
    color:var(--text);
    border-top-left-radius:4px;
  }

  .chat-msg.enviada .chat-bubble{
    background:var(--chat-bubble-enviada);
    color:var(--msg-enviada-text);
    border-top-right-radius:4px;
  }

  .chat-msg.enviada .chat-bubble.erro{
    background:var(--chat-bubble-erro);
  }

  .chat-bubble .texto{
    white-space:pre-wrap;
    word-break:break-word;
  }

  .chat-bubble .meta{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:4px;
    font-size:10px;
    color:var(--muted);
    margin-top:3px;
    line-height:1;
  }

  .chat-msg.enviada .chat-bubble .meta{
    color:rgba(0,0,0,.45);
  }

  html[data-theme="dark"] .chat-msg.enviada .chat-bubble .meta{
    color:rgba(232,232,232,.55);
  }

  .chat-bubble .meta .status{
    font-size:11px;
    line-height:1;
  }

  /* Barra de input fixa no fundo */
  .chat-input-bar{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    padding:8px 8px calc(8px + env(safe-area-inset-bottom));
    background:var(--surface);
    border-top:1px solid var(--border);
    display:flex;
    align-items:flex-end;
    gap:8px;
    z-index:15;
  }

  .chat-input-bar textarea{
    flex:1;
    border:1px solid var(--border);
    border-radius:20px;
    padding:10px 14px;
    font-size:15px;
    font-family:inherit;
    background:var(--input-bg);
    color:var(--text);
    outline:none;
    resize:none;
    max-height:100px;
    min-height:40px;
    line-height:1.4;
  }

  .chat-input-bar textarea:focus{
    border-color:var(--primary);
  }

  .chat-input-bar textarea:disabled{
    opacity:.5;
    cursor:not-allowed;
  }

  .chat-input-bar .btn-enviar{
    width:40px;
    height:40px;
    border-radius:50%;
    background:var(--primary);
    color:#fff;
    border:none;
    cursor:pointer;
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    transition:transform .1s, opacity .15s;
  }
  .chat-input-bar .btn-enviar:active{
    transform:scale(.92);
  }
  .chat-input-bar .btn-enviar:disabled{
    opacity:.4;
    cursor:not-allowed;
  }
  .chat-input-bar .btn-enviar svg{
    display:block;
  }

  /* =========================================================
     OVERLAY (configurações)
     ========================================================= */
  .overlay{
    position:fixed;
    inset:0;
    background:var(--overlay-bg);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:100;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .overlay.show{
    display:flex;
  }

  .sheet{
    background:var(--surface);
    width:100%;
    max-width:520px;
    max-height:88vh;
    border-radius:16px 16px 0 0;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    animation:slideUp .2s ease;
  }
  @keyframes slideUp{
    from{ transform:translateY(20px); opacity:.6; }
    to{ transform:translateY(0); opacity:1; }
  }

  .sheet-header{
    padding:14px 16px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex:0 0 auto;
  }
  .sheet-title{
    font-size:16px;
    font-weight:700;
    color:var(--text);
  }
  .sheet-close{
    background:transparent;
    border:none;
    font-size:22px;
    color:var(--muted);
    cursor:pointer;
    padding:0 4px;
    line-height:1;
  }

  .sheet-body{
    flex:1 1 auto;
    overflow-y:auto;
    padding:16px;
  }
  .sheet-footer{
    flex:0 0 auto;
    padding:12px 16px;
    border-top:1px solid var(--border);
    display:flex;
    gap:8px;
  }

  .form-group{
    margin-bottom:14px;
  }
  .form-group label{
    display:block;
    font-size:12px;
    font-weight:600;
    color:var(--muted);
    margin-bottom:6px;
    text-transform:uppercase;
    letter-spacing:.5px;
  }
  .form-group input{
    width:100%;
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px 14px;
    font-size:15px;
    font-family:inherit;
    background:var(--input-bg);
    color:var(--text);
    outline:none;
    transition:border .15s;
  }
  .form-group input:focus{
    border-color:var(--primary);
  }

  .form-aviso{
    font-size:12px;
    color:var(--muted);
    line-height:1.5;
    margin-bottom:16px;
    padding:10px 12px;
    background:var(--input-bg-alt);
    border-radius:8px;
  }

  .btn{
    border:none;
    border-radius:8px;
    font-size:15px;
    font-weight:600;
    padding:12px 16px;
    cursor:pointer;
    transition:background .15s;
    flex:1;
  }
  .btn-primary{
    background:var(--primary);
    color:#fff;
  }
  .btn-primary:active{
    background:var(--primary-dark);
  }
  .btn-primary:disabled{
    opacity:.5;
    cursor:not-allowed;
  }
  .btn-secondary{
    background:var(--btn-bg);
    color:var(--text);
  }
  .btn-secondary:active{
    background:var(--btn-active);
  }

  ::-webkit-scrollbar{ width:0; height:0; }
</style>
</head>
<body>

<!-- =========================================================
     TELA PRINCIPAL (LISTA)
     ========================================================= -->
<div id="telaLista">
  <header class="app-header">
    <span class="header-title">💬 Mila Whats</span>
    <button class="header-btn" id="btnConfig" aria-label="Configurações">⚙️</button>
  </header>

  <div class="content" id="content"></div>

  <button class="btn-float" id="btnReload" aria-label="Recarregar" style="display:none;">🔄</button>
</div>

<!-- =========================================================
     TELA DE CONVERSA (INICIALMENTE ESCONDIDA)
     ========================================================= -->
<div id="telaConversa" style="display:none;">
  <header class="app-header">
    <button class="header-btn header-voltar" id="btnVoltar" aria-label="Voltar">←</button>
    <span class="header-title">
      <span class="nome-conversa" id="nomeConversa">—</span>
    </span>
    <button class="header-btn" id="btnReloadConversa" aria-label="Recarregar">🔄</button>
  </header>

  <div class="chat-container" id="chatContainer"></div>

  <div class="chat-input-bar" id="chatInputBar">
    <textarea id="inputMensagem" placeholder="Digite uma mensagem..." rows="1"></textarea>
    <button class="btn-enviar" id="btnEnviar" aria-label="Enviar">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
        <path d="M3.4 20.4l17.45-7.48a1 1 0 0 0 0-1.84L3.4 3.6a1 1 0 0 0-1.4.92v5.6c0 .5.37.92.86.99L14 12 2.86 12.89a1 1 0 0 0-.86.99v5.6a1 1 0 0 0 1.4.92z"/>
      </svg>
    </button>
  </div>
</div>

<!-- OVERLAY: CONFIGURAÇÕES -->
<div class="overlay" id="overlayConfig">
  <div class="sheet">
    <div class="sheet-header">
      <div class="sheet-title">Configurações</div>
      <button class="sheet-close" data-close="overlayConfig">✕</button>
    </div>
    <div class="sheet-body">
      <div class="form-aviso">
        💡 Preencha com os dados do backend Mila Nails. Essas informações
        ficam salvas apenas neste aparelho.
      </div>
      <div class="form-group">
        <label for="cfgBackendUrl">URL do backend</label>
        <input type="url" id="cfgBackendUrl" placeholder="https://mila-nails-backend.onrender.com" autocomplete="off">
      </div>
      <div class="form-group">
        <label for="cfgApiKey">API Key</label>
        <input type="password" id="cfgApiKey" placeholder="mila_nails_sk_..." autocomplete="off">
      </div>
    </div>
    <div class="sheet-footer">
      <button class="btn btn-secondary" data-close="overlayConfig">Cancelar</button>
      <button class="btn btn-primary" id="btnSalvarConfig">Salvar</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  const LS_CONFIG = "mila_whats_config";
  const LS_TEMA   = "mila_whats_tema";
  const INTERVALO_REFRESH = 15000;

  /* =========================================================
     ESTADO
     ========================================================= */
  let state = {
    backendUrl: "",
    apiKey: "",

    conversas: [],
    carregando: false,
    erro: null,

    telefoneAtual: null,
    clienteAtual: "",
    mensagens: [],
    carregandoConversa: false,
    erroConversa: null,
    enviando: false,
    janelaAberta: false,
    janelaFechaEm: null,

    timerRefresh: null
  };

  /* =========================================================
     PERSISTÊNCIA
     ========================================================= */
  function loadConfig(){
    try{
      const raw = JSON.parse(localStorage.getItem(LS_CONFIG) || "null");
      if(raw && typeof raw === "object"){
        state.backendUrl = typeof raw.backendUrl === "string" ? raw.backendUrl : "";
        state.apiKey     = typeof raw.apiKey === "string" ? raw.apiKey : "";
      }
    }catch(e){}
  }

  function saveConfig(){
    localStorage.setItem(LS_CONFIG, JSON.stringify({
      backendUrl: state.backendUrl,
      apiKey: state.apiKey
    }));
  }

  function temConfig(){
    return !!(state.backendUrl && state.apiKey);
  }

  /* =========================================================
     HELPERS
     ========================================================= */
  function escapeHtml(s){
    if(s === undefined || s === null) return "";
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function iniciais(nome){
    if(!nome) return "?";
    const partes = nome.trim().split(/\s+/);
    if(partes.length === 1) return partes[0].slice(0, 2).toUpperCase();
    return (partes[0][0] + partes[partes.length - 1][0]).toUpperCase();
  }

  function formatarHorario(iso){
    if(!iso) return "";
    const d = new Date(iso);
    const agora = new Date();
    const mesmoDia = d.toDateString() === agora.toDateString();

    const ontem = new Date(agora);
    ontem.setDate(ontem.getDate() - 1);
    const ehOntem = d.toDateString() === ontem.toDateString();

    const hh = String(d.getHours()).padStart(2, "0");
    const mm = String(d.getMinutes()).padStart(2, "0");

    if(mesmoDia) return hh + ":" + mm;
    if(ehOntem)  return "ontem";
    return String(d.getDate()).padStart(2, "0") + "/" +
           String(d.getMonth() + 1).padStart(2, "0");
  }

  function formatarHoraBubble(iso){
    if(!iso) return "";
    const d = new Date(iso);
    return String(d.getHours()).padStart(2, "0") + ":" +
           String(d.getMinutes()).padStart(2, "0");
  }

  function calcularJanela24h(mensagens){
    for(let i = mensagens.length - 1; i >= 0; i--){
      if(mensagens[i].direcao === "recebida"){
        const quando = new Date(mensagens[i].enviado_em).getTime();
        const agora = Date.now();
        const diff = agora - quando;
        const VINTE_QUATRO_HORAS = 24 * 60 * 60 * 1000;
        return {
          aberta: diff < VINTE_QUATRO_HORAS,
          fechaEm: new Date(quando + VINTE_QUATRO_HORAS).toISOString()
        };
      }
    }
    return { aberta: false, fechaEm: null };
  }

  /* =========================================================
     BADGE (contador no ícone do app)
     ========================================================= */
  async function atualizarBadge(){
    // Verifica se o navegador suporta a API
    if(!("setAppBadge" in navigator)){
      return;
    }

    // Sem config → limpa o badge
    if(!temConfig()){
      try{ await navigator.clearAppBadge(); }catch(e){}
      return;
    }

    try{
      const url = state.backendUrl.replace(/\/+$/, "") + "/conversas";
      const resp = await fetch(url, {
        method: "GET",
        headers: { "x-api-key": state.apiKey }
      });
      const data = await resp.json().catch(() => ({}));

      if(!resp.ok){
        try{ await navigator.clearAppBadge(); }catch(e){}
        return;
      }

      // Soma o total de mensagens não lidas
      const conversas = Array.isArray(data.conversas) ? data.conversas : [];
      let total = 0;
      conversas.forEach(c => {
        if(typeof c.mensagens_nao_lidas === "number" && c.mensagens_nao_lidas > 0){
          total += c.mensagens_nao_lidas;
        }
      });

      if(total > 0){
        await navigator.setAppBadge(total);
      } else {
        await navigator.clearAppBadge();
      }
    }catch(e){
      // Falha silenciosa
    }
  }

  /* =========================================================
     OVERLAYS
     ========================================================= */
  function openOverlay(id){ document.getElementById(id).classList.add("show"); }
  function closeOverlay(id){ document.getElementById(id).classList.remove("show"); }

  document.querySelectorAll("[data-close]").forEach(btn => {
    btn.addEventListener("click", () => closeOverlay(btn.getAttribute("data-close")));
  });
  document.querySelectorAll(".overlay").forEach(ov => {
    ov.addEventListener("click", e => { if(e.target === ov) closeOverlay(ov.id); });
  });

  /* =========================================================
     NAVEGAÇÃO ENTRE TELAS
     ========================================================= */
  function mostrarLista(){
    document.getElementById("telaConversa").style.display = "none";
    document.getElementById("telaLista").style.display = "block";
    state.telefoneAtual = null;
    state.clienteAtual = "";
    state.mensagens = [];

    if(state.timerRefresh){
      clearInterval(state.timerRefresh);
      state.timerRefresh = null;
    }

    carregarConversas();
  }

  function mostrarConversa(telefone, nome){
    document.getElementById("telaLista").style.display = "none";
    document.getElementById("telaConversa").style.display = "block";
    state.telefoneAtual = telefone;
    state.clienteAtual = nome || "Cliente";
    document.getElementById("nomeConversa").textContent = state.clienteAtual;

    state.mensagens = [];
    state.erroConversa = null;

    carregarConversa();

    if(state.timerRefresh) clearInterval(state.timerRefresh);
    state.timerRefresh = setInterval(() => {
      if(state.telefoneAtual) carregarConversa({ silencioso: true });
    }, INTERVALO_REFRESH);
  }

  /* =========================================================
     RENDER: LISTA
     ========================================================= */
  function renderLista(){
    const content = document.getElementById("content");
    const btnReload = document.getElementById("btnReload");

    if(!temConfig()){
      content.innerHTML = renderSemConfig();
      btnReload.style.display = "none";
      return;
    }

    if(state.carregando){
      content.innerHTML = renderCarregando();
      btnReload.style.display = "flex";
      return;
    }

    if(state.erro){
      content.innerHTML = renderErro(state.erro);
      btnReload.style.display = "flex";
      return;
    }

    if(!state.conversas || state.conversas.length === 0){
      content.innerHTML = renderVazio();
      btnReload.style.display = "flex";
      return;
    }

    content.innerHTML = renderListaConversas(state.conversas);
    btnReload.style.display = "flex";
  }

  function renderSemConfig(){
    return `
      <div class="vazio">
        <div class="icone">⚙️</div>
        <div class="titulo">Bem-vindo ao Mila Whats</div>
        <div class="texto">
          Para começar, configure a conexão com o backend
          tocando no ícone de engrenagem no topo da tela.
        </div>
        <button class="btn" id="btnAbrirConfigInicial">Abrir configurações</button>
      </div>
    `;
  }

  function renderCarregando(){
    return `
      <div class="carregando">
        <div class="spinner"></div>
        <div>Carregando conversas...</div>
      </div>
    `;
  }

  function renderVazio(){
    return `
      <div class="vazio">
        <div class="icone">💬</div>
        <div class="titulo">Sem conversas por enquanto</div>
        <div class="texto">
          As mensagens aparecerão aqui automaticamente
          quando as clientes responderem aos lembretes.
        </div>
        <button class="btn" id="btnRecarregarVazio">🔄 Recarregar</button>
      </div>
    `;
  }

  function renderErro(msg){
    return `
      <div class="erro">
        <div class="icone">⚠️</div>
        <div class="titulo">Não foi possível carregar</div>
        <div class="texto">${escapeHtml(msg)}</div>
        <button class="btn" id="btnRecarregarErro">Tentar novamente</button>
      </div>
    `;
  }

  function renderListaConversas(conversas){
    let html = '<div class="lista">';
    conversas.forEach(c => {
      const nome = c.cliente || "Cliente";
      const ultima = c.ultima_mensagem || "(sem mensagem)";
      const ehEnviada = c.ultima_direcao === "enviada";
      const horario = formatarHorario(c.ultima_data);

      html += `
        <div class="conversa" data-telefone="${escapeHtml(c.telefone)}" data-cliente="${escapeHtml(nome)}">
          <div class="avatar">${escapeHtml(iniciais(nome))}</div>
          <div class="info">
            <div class="linha1">
              <div class="nome">${escapeHtml(nome)}</div>
              <div class="horario">${escapeHtml(horario)}</div>
            </div>
            <div class="ultima ${ehEnviada ? 'enviada' : ''}">${escapeHtml(ultima)}</div>
          </div>
        </div>
      `;
    });
    html += "</div>";
    return html;
  }

  /* =========================================================
     RENDER: CONVERSA
     ========================================================= */
  function renderConversa(){
    const container = document.getElementById("chatContainer");
    const inputBar = document.getElementById("chatInputBar");
    const inputMensagem = document.getElementById("inputMensagem");
    const btnEnviar = document.getElementById("btnEnviar");

    if(state.carregandoConversa && state.mensagens.length === 0){
      container.innerHTML = `
        <div class="carregando" style="background:transparent;">
          <div class="spinner"></div>
          <div>Carregando mensagens...</div>
        </div>
      `;
      inputBar.style.display = "none";
      return;
    }

    if(state.erroConversa && state.mensagens.length === 0){
      container.innerHTML = `
        <div class="erro" style="background:transparent;">
          <div class="icone">⚠️</div>
          <div class="titulo">Não foi possível carregar</div>
          <div class="texto">${escapeHtml(state.erroConversa)}</div>
          <button class="btn" id="btnRecarregarConversaErro">Tentar novamente</button>
        </div>
      `;
      inputBar.style.display = "none";
      return;
    }

    inputBar.style.display = "flex";

    if(!state.janelaAberta){
      inputMensagem.disabled = true;
      btnEnviar.disabled = true;
      inputMensagem.placeholder = "Janela de 24h fechada";
    } else {
      inputMensagem.disabled = state.enviando;
      btnEnviar.disabled = state.enviando || !inputMensagem.value.trim();
      inputMensagem.placeholder = "Digite uma mensagem...";
    }

    let html = "";
    if(!state.janelaAberta && state.mensagens.length > 0){
      html += `
        <div class="chat-aviso-24h">
          <span class="icone">⏰</span>
          <span>Janela de 24h fechada. Só é possível enviar após a cliente enviar uma nova mensagem.</span>
        </div>
      `;
    }

    if(state.mensagens.length === 0){
      html += `
        <div style="text-align:center;color:var(--muted);font-size:13px;padding:40px 16px;">
          Nenhuma mensagem ainda.
        </div>
      `;
    } else {
      state.mensagens.forEach(m => {
        html += renderBubble(m);
      });
    }

    container.innerHTML = html;

    setTimeout(() => {
      container.scrollTop = container.scrollHeight;
    }, 50);
  }

  function renderBubble(m){
    const ehEnviada = m.direcao === "enviada";
    const classe = ehEnviada ? "enviada" : "recebida";
    const erro = m._erro ? " erro" : "";
    const hora = formatarHoraBubble(m.enviado_em);

    let statusIcon = "";
    if(ehEnviada){
      if(m._enviando) statusIcon = "⏳";
      else if(m._erro) statusIcon = "⚠️";
      else statusIcon = "✓";
    }

    return `
      <div class="chat-msg ${classe}" data-msg-id="${escapeHtml(m.id || "")}">
        <div class="chat-bubble${erro}">
          <div class="texto">${escapeHtml(m.conteudo || "")}</div>
          <div class="meta">
            <span>${escapeHtml(hora)}</span>
            ${statusIcon ? `<span class="status">${statusIcon}</span>` : ""}
          </div>
        </div>
      </div>
    `;
  }

  /* =========================================================
     API: LISTA
     ========================================================= */
  async function carregarConversas(){
    if(!temConfig()) return;

    state.carregando = true;
    state.erro = null;
    renderLista();

    try{
      const url = state.backendUrl.replace(/\/+$/, "") + "/conversas";
      const resp = await fetch(url, {
        method: "GET",
        headers: { "x-api-key": state.apiKey }
      });

      const data = await resp.json().catch(() => ({}));
      if(!resp.ok) throw new Error(data.error || ("HTTP " + resp.status));

      state.conversas = Array.isArray(data.conversas) ? data.conversas : [];
      state.erro = null;
    }catch(err){
      state.erro = err.message || "Erro desconhecido";
      state.conversas = [];
    }finally{
      state.carregando = false;
      renderLista();
      atualizarBadge();
    }
  }

  /* =========================================================
     API: CONVERSA
     ========================================================= */
  async function carregarConversa(opts){
    opts = opts || {};
    const silencioso = !!opts.silencioso;

    if(!state.telefoneAtual) return;

    if(!silencioso){
      state.carregandoConversa = true;
      state.erroConversa = null;
      renderConversa();
    }

    try{
      const url = state.backendUrl.replace(/\/+$/, "") + "/conversas/" +
                  encodeURIComponent(state.telefoneAtual);
      const resp = await fetch(url, {
        method: "GET",
        headers: { "x-api-key": state.apiKey }
      });

      const data = await resp.json().catch(() => ({}));
      if(!resp.ok) throw new Error(data.error || ("HTTP " + resp.status));

      const novas = Array.isArray(data.mensagens) ? data.mensagens : [];

      const locaisPendentes = state.mensagens.filter(m => m._enviando || m._erro);
      state.mensagens = novas.concat(locaisPendentes);

      const info = calcularJanela24h(state.mensagens);
      state.janelaAberta = info.aberta;
      state.janelaFechaEm = info.fechaEm;

      state.erroConversa = null;
    }catch(err){
      state.erroConversa = err.message || "Erro desconhecido";
    }finally{
      state.carregandoConversa = false;
      renderConversa();
    }
  }

  /* =========================================================
     API: ENVIAR
     ========================================================= */
  async function enviarMensagem(){
    const input = document.getElementById("inputMensagem");
    const texto = (input.value || "").trim();
    if(!texto) return;

    if(!state.janelaAberta){
      alert("Janela de 24h fechada. Aguarde a cliente enviar uma nova mensagem.");
      return;
    }

    const msgTemp = {
      id: "temp_" + Date.now(),
      direcao: "enviada",
      conteudo: texto,
      enviado_em: new Date().toISOString(),
      _enviando: true
    };

    state.mensagens.push(msgTemp);
    state.enviando = true;
    input.value = "";
    input.style.height = "auto";
    renderConversa();

    try{
      const url = state.backendUrl.replace(/\/+$/, "") + "/responder";
      const resp = await fetch(url, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": state.apiKey
        },
        body: JSON.stringify({
          telefone: state.telefoneAtual,
          mensagem: texto
        })
      });

      const data = await resp.json().catch(() => ({}));
      if(!resp.ok) throw new Error(data.error || ("HTTP " + resp.status));

      msgTemp._enviando = false;
      await carregarConversa({ silencioso: true });
    }catch(err){
      msgTemp._enviando = false;
      msgTemp._erro = true;
      renderConversa();
      alert("Erro ao enviar: " + err.message);
    }finally{
      state.enviando = false;
      renderConversa();
    }
  }

  /* =========================================================
     EVENTOS: LISTA
     ========================================================= */
  document.getElementById("btnConfig").addEventListener("click", () => {
    document.getElementById("cfgBackendUrl").value = state.backendUrl || "";
    document.getElementById("cfgApiKey").value = state.apiKey || "";
    openOverlay("overlayConfig");
  });

  document.getElementById("btnSalvarConfig").addEventListener("click", () => {
    const url = document.getElementById("cfgBackendUrl").value.trim();
    const key = document.getElementById("cfgApiKey").value.trim();

    if(!url || !key){ alert("Preencha os dois campos."); return; }
    if(!/^https?:\/\//i.test(url)){ alert("A URL deve começar com http:// ou https://"); return; }

    state.backendUrl = url.replace(/\/+$/, "");
    state.apiKey = key;
    saveConfig();

    closeOverlay("overlayConfig");
    carregarConversas();
  });

  document.getElementById("btnReload").addEventListener("click", () => {
    const btn = document.getElementById("btnReload");
    btn.classList.add("girando");
    carregarConversas().finally(() => {
      setTimeout(() => btn.classList.remove("girando"), 400);
    });
  });

  document.getElementById("content").addEventListener("click", e => {
    const btnConfigInicial = e.target.closest("#btnAbrirConfigInicial");
    if(btnConfigInicial){ document.getElementById("btnConfig").click(); return; }

    const btnRecarregarVazio = e.target.closest("#btnRecarregarVazio");
    if(btnRecarregarVazio){ carregarConversas(); return; }

    const btnRecarregarErro = e.target.closest("#btnRecarregarErro");
    if(btnRecarregarErro){ carregarConversas(); return; }

    const conversa = e.target.closest(".conversa");
    if(conversa){
      const tel = conversa.getAttribute("data-telefone");
      const nome = conversa.getAttribute("data-cliente");
      mostrarConversa(tel, nome);
    }
  });

  /* =========================================================
     EVENTOS: CONVERSA
     ========================================================= */
  document.getElementById("btnVoltar").addEventListener("click", mostrarLista);

  document.getElementById("btnReloadConversa").addEventListener("click", () => {
    carregarConversa();
  });

  document.getElementById("chatContainer").addEventListener("click", e => {
    const btnRecarregar = e.target.closest("#btnRecarregarConversaErro");
    if(btnRecarregar) carregarConversa();
  });

  const inputMensagem = document.getElementById("inputMensagem");
  const btnEnviar = document.getElementById("btnEnviar");

  inputMensagem.addEventListener("input", () => {
    inputMensagem.style.height = "auto";
    inputMensagem.style.height = Math.min(inputMensagem.scrollHeight, 100) + "px";
    btnEnviar.disabled = state.enviando || !inputMensagem.value.trim();
  });

  btnEnviar.addEventListener("click", enviarMensagem);

  /* =========================================================
     BADGE — atualiza ao voltar para o app
     ========================================================= */
  document.addEventListener("visibilitychange", () => {
    if(document.visibilityState === "visible" && temConfig()){
      atualizarBadge();
    }
  });

  /* =========================================================
     BOOT
     ========================================================= */
  function boot(){
    loadConfig();
    renderLista();

    if(temConfig()){
      carregarConversas();
      atualizarBadge();
    }
  }

  boot();
})();
</script>
