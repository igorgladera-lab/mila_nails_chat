<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Mila Whats</title>

<script>
  (function(){
    try{
      var salvo = localStorage.getItem("mila_whats_tema");
      var tema;
      if(salvo === "dark" || salvo === "light"){
        tema = salvo;
      } else {
        tema = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", tema);
    }catch(e){}
  })();
</script>

<meta name="theme-color" content="#7b1e3a">
<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.json">

<link rel="icon" type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237b1e3a'/%3E%3Cpath d='M8 10 h16 v10 h-10 l-4 4 v-4 h-2 z' fill='%23ffffff'/%3E%3C/svg%3E">

<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Mila Whats">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
  :root{
    --bg:#faf7f5;
    --surface:#ffffff;
    --primary:#a02850;
    --primary-dark:#7b1e3a;
    --text:#2b2b2b;
    --muted:#8a7f7a;
    --border:#e8e2de;
    --header-h:52px;
    --msg-enviada:#dcf8c6;
    --msg-enviada-text:#1a1a1a;
    --msg-recebida:#ffffff;
    --msg-recebida-text:#2b2b2b;
    --aviso-24h:#fff3e0;
    --aviso-24h-borda:#f0a800;
    --aviso-24h-text:#6b5200;
  }

  html[data-theme="dark"]{
    --bg:#1a1a1a;
    --surface:#262626;
    --primary:#c03060;
    --primary-dark:#a02850;
    --text:#e8e8e8;
    --muted:#9a9a9a;
    --border:#3a3a3a;
    --msg-enviada:#1e3a20;
    --msg-enviada-text:#e8e8e8;
    --msg-recebida:#262626;
    --msg-recebida-text:#e8e8e8;
    --aviso-24h:#3a2e18;
    --aviso-24h-borda:#d99a00;
    --aviso-24h-text:#f0d580;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

  html, body{
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
    overscroll-behavior:none;
  }

  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    position:fixed;
    inset:0;
    touch-action:manipulation;
  }

  header.app-header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:var(--header-h);
    padding-top:env(safe-area-inset-top);
    box-sizing:content-box;
    background:var(--primary);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding-left:16px;
    padding-right:12px;
    font-weight:700;
    font-size:18px;
    letter-spacing:1px;
    z-index:10;
    box-shadow:0 1px 3px rgba(0,0,0,.15);
  }

  header.app-header .header-title{
    flex:1;
  }

  header.app-header .header-btn{
    background:transparent;
    border:none;
    color:#fff;
    font-size:22px;
    cursor:pointer;
    padding:8px;
    line-height:1;
    border-radius:50%;
  }

  header.app-header .header-btn:active{
    background:rgba(255,255,255,.15);
  }

  .content{
    position:fixed;
    left:0;
    right:0;
    top:calc(var(--header-h) + env(safe-area-inset-top));
    bottom:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:16px;
  }

  .placeholder{
    text-align:center;
    padding:48px 16px;
    color:var(--muted);
  }

  .placeholder .icon{
    font-size:64px;
    margin-bottom:16px;
    opacity:.5;
  }

  .placeholder .texto{
    font-size:16px;
    margin-bottom:8px;
  }

  .placeholder .sub{
    font-size:13px;
    opacity:.7;
  }
</style>
</head>
<body>

<header class="app-header">
  <span class="header-title">💬 Mila Whats</span>
  <button class="header-btn" id="btnConfig" aria-label="Configurações">⚙️</button>
</header>

<div class="content">
  <div class="placeholder">
    <div class="icon">💬</div>
    <div class="texto">Mila Whats</div>
    <div class="sub">Em construção — Fase 6 concluída</div>
  </div>
</div>

<script>
(function(){
  "use strict";

  // Referência apenas para confirmar que o JS está rodando
  console.log("[Mila Whats] Fase 6 carregada");

  document.getElementById("btnConfig").addEventListener("click", () => {
    alert("Configurações — serão implementadas na Fase 7.");
  });
})();
</script>
</body>
</html>
